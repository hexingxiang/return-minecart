    for(const [x,y,w,h] of [[88,28,21,19],[115,31,23,16],[147,29,22,18],[91,61,31,14],[131,60,19,15],[155,62,18,13]]){
      rect(c,x,y,w,h,'#2e394a');rect(c,x+1,y+1,w-2,h-2,'#2b3546');
    }
    for(const x of [79,176]){
      rect(c,x,17,4,72,'#181f2e');rect(c,x+1,17,2,71,'#48505c');
    }
    for(const y of [19,46,75]){
      rect(c,75,y,109,4,'#474958');rect(c,76,y,107,1,'#77716d');rect(c,78,y+4,103,2,'#171f2e');
    }
    // Empty hooks, a hanging inventory tag and its red audit seal.
    rect(c,111,50,1,5,'#66636a');rect(c,110,55,3,1,'#707076');
    rect(c,160,49,1,6,'#766354');rect(c,157,54,8,10,'#a59c83');rect(c,162,59,2,3,'#955f57');
    // Corrugated warehouse shutter and a crooked bureaucratic notice.
    rect(c,211,15,97,75,'#293242');rect(c,215,19,89,66,'#323c4c');
    for(let y=22;y<85;y+=6){rect(c,216,y,87,1,'#46505b');rect(c,216,y+2,86,1,'#283343');}
    rect(c,209,13,101,4,'#4c5461');rect(c,209,17,3,74,'#444d5c');
    rect(c,227,32,16,21,'#272f3e');rect(c,226,30,16,21,'#a99f88');
    rect(c,228,33,11,1,'#655e61');rect(c,228,36,8,1,'#736a68');rect(c,228,40,9,1,'#736a68');
    rect(c,234,43,5,5,'#986359');rect(c,235,44,3,3,'#c19e87');rect(c,236,45,1,1,'#986359');
    // Worn plank floor, receding seams and a small drain for the last coin.
    polygon(c,[[0,84],[320,84],[320,128],[0,128]],'#374152');
    for(const [y,ink] of [[87,'#263443'],[93,'#303d4d'],[102,'#283443'],[116,'#293544']])rect(c,0,y,320,1,ink);
    for(const [x,y,l] of [[18,98,16],[59,112,27],[93,104,13],[130,121,31],[185,116,12],[243,113,19],[278,99,12],[23,124,24]]){
      rect(c,x,y,l,1,'#4c5360');rect(c,x+5,y+1,Math.max(2,l-9),1,'#323b4b');
    }
    for(const x of [8,48,106,167,222,268,306]){
      line(c,x,84,1.3*x-35,127,'#303b4b');
    }
    polygon(c,[[226,114],[248,114],[253,117],[226,118]],'#192a39');
    for(let x=229;x<248;x+=4)line(c,x,114,x+2,117,'#5c6570');
    // A single overhead work lamp casts a deliberately narrow, cold cone of light.
    line(c,158,0,158,10,'#1d2634',2);
    polygon(c,[[153,11],[157,8],[161,8],[166,12],[166,14],[151,14]],'#68717c');
    rect(c,153,14,11,2,'#b7b4a4');
    c.save();c.globalAlpha=.075;
    polygon(c,[[152,16],[165,16],[211,101],[108,101]],'#d0c8a6');c.restore();
  }

  function receipt(c,x,y,slant) {
    c.save();c.translate(snap(x),snap(y));c.rotate(slant);
    polygon(c,[[-6,-9],[6,-9],[6,9],[4,8],[2,9],[0,8],[-2,9],[-4,8],[-6,9]],'#c7bca4');
    rect(c,-4,-6,9,1,'#796d69');rect(c,-4,-3,6,1,'#93816e');rect(c,-4,0,7,1,'#93816e');
    rect(c,0,2,5,5,'#a45e57');rect(c,1,3,3,3,'#d9b4a0');rect(c,2,4,1,1,'#a45e57');
    c.restore();
  }

  function wearyMiner(c,t) {
    const slump=ease(clamp((t-.2)/.62));
    const drop=snap(3*slump);
    crate(c,142,93,27,20,true);
    // Legs and heavy work boots: one flat on the floor, one turned inward.
    polygon(c,[[148,88],[159,88],[162,95],[172,99],[172,110],[167,110],[165,103],[153,101],[147,97]],'#314552');
    polygon(c,[[145,91],[153,95],[147,101],[143,110],[137,109],[139,99]],'#455766');
    polygon(c,[[136,107],[144,108],[145,113],[142,115],[131,115],[131,112]],'#242e3a');
    polygon(c,[[166,108],[173,108],[177,112],[180,113],[180,115],[166,114]],'#232e39');
    rect(c,132,114,13,1,'#8b7a69');rect(c,167,114,12,1,'#807366');
    // Jacket seam, elbow on knee, head weighed down toward the upturned wallet.
    polygon(c,[[145,77+drop],[151,74+drop],[160,77+drop],[165,87+drop],[159,94],[147,95],[141,91]],'#243b49');
    polygon(c,[[146,78+drop],[151,75+drop],[157,78+drop],[160,83+drop],[155,87],[155,92],[145,91]],'#526975');
    rect(c,146,83+drop,2,7,'#71818a');rect(c,148,91,8,2,'#344a58');
    polygon(c,[[157,80+drop],[161,83+drop],[166,89],[172,86],[175,88],[166,96],[162,95],[156,88]],'#66777c');
    polygon(c,[[170,86],[176,84],[179,86],[177,89],[172,90]],'#b09179');
    c.save();c.translate(153+snap(slump*2),75+drop);c.rotate(.12+slump*.13);
    polygon(c,[[-8,-10],[-4,-14],[6,-13],[9,-9],[9,-6],[12,-3],[9,-2],[8,3],[3,6],[-4,3],[-8,-1]],'#795f58');
    polygon(c,[[-5,-10],[5,-11],[7,-8],[7,-4],[10,-3],[7,-2],[7,2],[3,3],[-2,0],[-5,-4]],'#ba9983');
    line(c,3,-5,7,-4,'#5b504e');rect(c,4,0,3,1,'#7b6660');
    rect(c,-9,-10,18,3,'#7f674f');
    polygon(c,[[-8,-10],[-8,-15],[-5,-18],[2,-19],[7,-16],[8,-12],[11,-10]],'#b49560');
    polygon(c,[[-7,-13],[-5,-16],[0,-17],[2,-16],[-2,-15],[-4,-12]],'#d6b67c');
    rect(c,6,-13,6,4,'#596472');rect(c,9,-13,3,3,'#a5b4b3');
    c.restore();
    // Wallet is held open; both pockets show their empty pale lining.
    polygon(c,[[181,83],[187,80],[188,88],[182,91],[177,88],[175,82]],'#5c4c4b');
    polygon(c,[[176,82],[181,84],[181,88],[177,86]],'#ac9780');
    polygon(c,[[182,84],[186,82],[186,87],[182,88]],'#bbab91');
    rect(c,180,89,4,1,'#c4a378');
  }

  function defeat(c,t) {
    warehouse(c,t);
    // The final loaded crate rolls through the shutter before the till is empty.
    if(t<.36){
      const x=mix(248,337,ease(t/.36));
      crate(c,snap(x),79,24,16,true);rect(c,x-2,95,28,2,'#505a66');
      for(const dx of [3,18])disc(c,x+dx,98,3,'#242e3c');
    }
    for(let x=0;x<122;x+=9)rect(c,x,101,4,3,'#5c5559');
    rect(c,0,101,128,1,'#8c9093');rect(c,0,104,119,1,'#6c737e');
    mineCart(c,61,101,1.7,true);
    // Loose empty crate on its side, including its dark open end.
    polygon(c,[[261,85],[281,85],[293,91],[293,106],[270,108],[259,101]],'#766d66');
    polygon(c,[[262,87],[279,87],[286,91],[272,93]],'#948477');
    polygon(c,[[272,95],[289,93],[289,103],[272,105]],'#272f3a');
    rect(c,263,91,2,8,'#a18f79');rect(c,271,104,19,2,'#857365');
    wearyMiner(c,t);
    const fly=ease(clamp((t-.05)/.72));
    receipt(c,mix(230,203,fly)+Math.sin(fly*Math.PI*2)*6,mix(49,109,fly),mix(-.15,.40,fly));
    if(t<.12)receipt(c,197,95,.18);
    else receipt(c,195+Math.sin(t*3)*2,98+ease(clamp((t-.12)/.45))*15,-.53);
    if(t>.18 && t<.79){
      const phase=(t-.18)/.61;
      const x=mix(180,238,phase),y=92+20*phase-Math.sin(phase*Math.PI*2)*4;
      rect(c,x,y,phase>.28?2:3,4,'#bf9c63');rect(c,x,y,1,2,'#e5c789');
    }
    if(t>.78 && t<.93)sparkle(c,238,114,1,'#b9b5a1');
    // A low desk drawer is open in the shaded foreground.
    rect(c,0,115,20,13,'#282e3b');rect(c,0,115,23,3,'#655b59');
    rect(c,0,122,15,5,'#1c2734');rect(c,2,126,13,2,'#635956');
  }

  function draw(canvas,outcome,progress) {
    if(canvas.width!==W)canvas.width=W;if(canvas.height!==H)canvas.height=H;
    const c=canvas.getContext('2d'),t=clamp(Number.isFinite(progress)?progress:0);
    c.save();c.setTransform(1,0,0,1,0,0);c.imageSmoothingEnabled=false;
    if(outcome==='win')victory(c,t);else defeat(c,t);
    c.restore();
  }
  window.MineFinaleArt={draw};
})();

</script>
<script>
(() => {
  'use strict';
  const q = selector => document.querySelector(selector);
  const game = MineGame.create();
  const board = q('#board');
  const ctx = board.getContext('2d');
  board.width = 320;
  board.height = 280;
  const modal = q('#modal');
  const neighbors = [[0,-1],[1,0],[0,1],[-1,0]];
  const artTiles = {ground:'floor',rock:'wall',copper:'copper',crystal:'crystal'};
  const cardIcon = {long:'rail',coil:'copper',lens:'crystal'};
  const oreName = {copper:'铜矿',crystal:'蓝晶'};
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let soundOn = true;
  try { soundOn=localStorage.getItem('minecart-sound')!=='off'; } catch {}
  function unlockSound(){
    if(!soundOn)return;
    try{
      const AudioEngine=window.AudioContext || window.webkitAudioContext;
      if(!AudioEngine)return;
      if(!soundContext)soundContext=new AudioEngine();
      if(soundContext.state==='suspended')soundContext.resume().catch(()=>{});
    }catch{}
  }
  document.addEventListener('pointerdown',unlockSound,{capture:true,passive:true});
  document.addEventListener('keydown',unlockSound,true);
  document.addEventListener('click',unlockSound,true);
  let soundContext;
  let animation = null;
  let lastFrame = 0;
  let cachedView;
  let cachedPreview;
  let drawnCell = -1;
  let modalReturnFocus = null;
  let excavation = null;

  function iconMarkup(name, cls='icon') {
    return '<canvas class="'+cls+'" data-icon="'+name+'" width="16" height="16" aria-hidden="true"></canvas>';
  }

  function paintIcons(root=document) {
    root.querySelectorAll('[data-icon]').forEach(canvas => {
      canvas.width=16; canvas.height=16;
      const c=canvas.getContext('2d'), name=canvas.dataset.icon;
      if(name==='audio' || name==='plan') {
        const sprite=name==='audio'
          ? ['     11    ','   1111  1 ',' 111111   1',' 111111   1',' 111111   1','   1111  1 ','     11    ']
          : [' 11111111',' 12222221',' 12112121',' 12222221',' 12111221',' 12222221',' 11111111'];
        sprite.forEach((line,y)=>[...line].forEach((ch,x)=>{
          if(ch===' ') return;
          c.fillStyle=ch==='1'?'#e6c384':'#637789'; c.fillRect(x+2,y+4,1,1);
        }));
      } else {
        MineArt.drawIcon(c,name==='card'?'ticket':name,0,0,1);
      }
    });
  }

  function paintTitle(){
    const c=q('#title-art').getContext('2d',{willReadFrequently:true});
    c.clearRect(0,0,80,20);
    c.font='900 18px "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
    c.fillStyle='#fff'; c.textBaseline='alphabetic'; c.textAlign='center';
    [...'回程矿车'].forEach((letter,i)=>c.fillText(letter,10+i*20,16));
    const image=c.getImageData(0,0,80,20);
    for(let n=0;n<image.data.length;n+=4){
      image.data[n]=246; image.data[n+1]=225; image.data[n+2]=186;
      image.data[n+3]=image.data[n+3]>70?255:0;
    }
    c.putImageData(image,0,0);
  }

  function tone(freq,seconds=0.09,type='triangle',level=0.085,delay=0){
    if(!soundOn || !soundContext || soundContext.state!=='running') return;
    try{
      const osc=soundContext.createOscillator(),gain=soundContext.createGain();
      osc.type=type; osc.frequency.value=freq;
      const now=soundContext.currentTime+delay;
      gain.gain.setValueAtTime(0,now); gain.gain.linearRampToValueAtTime(level,now+0.008);
      gain.gain.exponentialRampToValueAtTime(0.001,now+seconds);
      osc.connect(gain); gain.connect(soundContext.destination);
      osc.start(now); osc.stop(now+seconds+0.012);
    }catch{}
  }

  function chord(notes){notes.forEach((f,i)=>tone(f,.18,'triangle',.07,i*.085));}
  function impact(canvas){if(!reducedMotion && canvas.animate)canvas.animate([{filter:'brightness(1.20)',transform:'translateY(1px)'},{filter:'brightness(1)',transform:'translateY(0)'}],{duration:210,easing:'ease-out'});}
  const same=(a,b)=>a.x===b.x && a.y===b.y;
  const key=p=>p.x+','+p.y;
  function makeOreFeedback(controller,reduced){
    let selected=null, pulse=null;
    return {
      at(x,y){return MineFeedback.inspect(controller.state,x,y);},
      toggle(ore){selected=selected && same(selected,ore)?null:ore;},
      unselect(){selected=null;},
      clear(){selected=null;pulse=null;},
      get note(){return selected?.note || '';},
      get pulsing(){return Boolean(pulse);},
      add(previous,current){
        const ores=MineFeedback.added(previous,current);
        if(!ores.length)return '';
        if(!reduced){
          const now=performance.now();
          // Keep gains from adjacent cells visible together during a fast swipe.
          const recent=pulse && now-pulse.start<150?pulse.ores:[];
          pulse={ores:[...recent,...ores],start:now};return '';
        }
        const gained={copper:0,crystal:0};
        ores.forEach(ore=>{gained[ore.type]+=ore.amount;});
        return '线路新增 '+oreText(gained)+'。';
      },
      apply(view,now){
        if(selected)view.inspect=selected;
        if(!pulse)return;
        const progress=Math.max(0,(now-pulse.start)/MineFeedback.pulseMs);
        if(progress>=1){pulse=null;return;}
        view.pulse={ores:pulse.ores,progress};
      }
    };
  }
  const feedback=makeOreFeedback(game,reducedMotion);

  function dispatchLabel(button,title,status='',detail=''){
    button.dataset.dispatch=status;
    button.replaceChildren(document.createTextNode(title));
    if(detail){
      const line=document.createElement('small');
      line.className='dispatch-detail';line.textContent=detail;button.append(line);
    }
  }

  function makeBoardView(controller, preview, zone, paint){
    const s=controller.state, tip=s.path[s.path.length-1], remaining=s.budget-controller.used();
    const moves=neighbors.map(([dx,dy])=>({x:tip.x+dx,y:tip.y+dy})).filter(p=>
      s.phase==='plan' && s.board[p.y]?.[p.x]==='ground' &&
      controller.trackCost(p.x,p.y)<=remaining && !s.path.some(v=>same(v,p)));
    return {
      tiles:s.board.map(row=>row.map(v=>artTiles[v]||'floor')),amounts:s.amounts,start:s.path[0],
      path:s.path,moves,cart:tip,collected:[],effects:[],returning:false,zone,paint,
      rubble:s.rubble,relic:s.relic,relicCollected:s.relic && s.collection.includes(s.relic.id),
      relicInReach:preview.relicStep>=0,targets:s.phase==='plan'?preview.steps.flatMap(step=>step.ores):[]
    };
  }

  let cartPaint='standard';
  function updateView(s) {
    cachedPreview=game.preview();
    cachedView=makeBoardView(game,cachedPreview,s.round<=3?0:s.round<=7?1:2,cartPaint);
    if(s.phase==='done' && !animation && s.result){
      cachedView.cart=s.path[0];
      cachedView.collected=s.result.steps.flatMap(step=>step.ores);
    }
  }

  function orderMarkup(s,counts){
    return Object.keys(oreName).filter(type=>s.order[type]>0).map(type=>{
      const met=counts[type]>=s.order[type];
      return '<div class="ore-row '+(met?'done':'')+'">'+iconMarkup(type)+'<span>'+oreName[type]+'</span><span class="number">'+counts[type]+' / '+s.order[type]+(met?' ✓':'')+'</span></div>';
    }).join('');
  }

  function drawOrder(s,counts){
    q('#order-rows').innerHTML=orderMarkup(s,counts);
    paintIcons(q('#order-rows'));
  }

  function stockMarkup(id,num,label){
    return '<span class="stock" title="'+label+'">'+iconMarkup(id)+'<span>'+label+' '+num+'</span></span>';
  }

  const campaign=MineLevels.stages;
  const specimens=MineLevels.relics;
  function specimen(id){return specimens.find(item=>item.id===id);}
  function nextLabel(s){
    if(!s.result?.firstClear && s.round<s.frontier)return '返回第 '+s.frontier+' 关 →';
    if(!s.result?.met)return '再试本关';
    if(s.round===campaign.length)return '进入深层矿区 →';
    return '进入下一关 →';
  }

  function oreText(quantities){
    return Object.keys(oreName).filter(type=>quantities[type]>0)
      .map(type=>quantities[type]+' '+oreName[type]).join('、') || '0 份矿石';
  }

  function refresh(message='',previous=null){
    const s=game.state;
    updateView(s);
    const gain=previous?feedback.add(previous,cachedPreview):'';
    const moving=Boolean(animation);
    const planning=s.phase==='plan' && !moving;
    const atStart=planning && s.path.length===1;
    const num=String(s.round).padStart(2,'0');
    q('#shift').textContent='第 '+num+' 关';
    q('#stage-name').textContent=s.stage.name;
    q('#express-tab').disabled=moving;
    q('#atlas').disabled=moving;q('#campaign-yard').disabled=moving;q('#campaign-scout').disabled=moving;
    q('#help').disabled=moving;
    const used=game.used();
    q('#rails').textContent=s.budget-used;
    q('#par').textContent='最短满单 '+game.par()+' 轨';
    q('#order-no').textContent='No. '+String(s.round).padStart(3,'0');
    const counts=moving?{copper:0,crystal:0}:(s.result || cachedPreview);
    drawOrder(s,counts);
    const side=q('#side-order');
    side.hidden=!s.relic;
    if(s.relic){
      const owned=s.collection.includes(s.relic.id);
      const withinReach=cachedView.relicInReach;
      side.classList.toggle('ready',owned||withinReach);
      const label=owned?'已收藏':withinReach?'回程可敲开':'贴着发光岩壁铺轨可发掘';
      side.innerHTML=iconMarkup('relic')+'支线 · '+label;
      paintIcons(side);
    }
    q('#launch').disabled=moving || (planning && s.path.length===1);
    const shortage=MineFeedback.shortage(s.order,cachedPreview);
    if(planning && !atStart){
      dispatchLabel(q('#launch'),shortage?'缺货发车 · 留在本关':'满单发车',shortage?'short':'ready',
        shortage || (s.round<s.frontier?'交齐本关订单':'首通抽装备卡'));
    }else dispatchLabel(q('#launch'),moving?'正在收矿…':planning?'发车收矿':nextLabel(s));
    q('#undo').disabled=!planning || s.path.length===1;
    q('#route-tip').hidden=!planning || s.round<3;
    const lesson={3:'带裂纹的碎岩格，要用 2 节轨道加固。',4:'亮铜矿簇每处出 2 份铜矿。',6:'蓝晶矿簇每处出 2 份蓝晶。',8:'赤铜富矿每处出 3 份铜矿。',9:'蓝晶富矿每处出 3 份蓝晶。'};
    const openingHint=s.round<=2?s.stage.tip:(lesson[s.round] || '按订单选择矿脉，再铺一条能把它们一起带回的路线。');
    const defaultHint=atStart?(s.round===1?'向右铺一格能交单，点矿看采位。藏品在北边的发光岩壁。':openingHint):
      moving?'矿车正在沿轨道回收矿石。':s.phase==='done'?(s.result.met?'订单已交齐，矿石已入库。':'矿石已入库，原图可以再试。'):
      (cachedPreview.copper>=s.order.copper && cachedPreview.crystal>=s.order.crystal)?
        (s.round<s.frontier?'这条线路已凑齐订单，可以发车。':'这条线路已凑齐订单！现在发车可以抽装备卡。'):
      (cachedView.moves.length===0?'这条线无法再延伸，可以发车或撤回调整。':'票面数字是这条线路预计收回的矿石。');
    q('#hint').textContent=(gain+message) || feedback.note || defaultHint;
    q('#hint').classList.remove('warn');
    q('#card-count').innerHTML='<button id="deck" class="quiet" style="min-height:26px;padding:3px 7px">卡册 '+s.owned.length+'/'+MineGame.cards.length+'</button>';
    q('#deck').onclick=()=>showDeck(false);
    q('#deck').disabled=moving;
    q('#museum').disabled=moving;
    q('#museum').textContent='图鉴 '+s.collection.length+'/'+specimens.length;
    q('#shelf').innerHTML=specimens.map(item=>{
      const owned=s.collection.includes(item.id);
      return '<button class="spec-slot '+(owned?'owned':'unknown')+'" data-specimen="'+item.id+'" '+(moving?'disabled':'')+'>'+
        iconMarkup(item.id)+'<span>'+item.name+'</span></button>';
    }).join('');
    const available=MineGame.cards.filter(c=>s.owned.includes(c.id));
    const basic={id:'',name:'标准矿斗',description:'收取轨道上下左右相邻的矿物，每处矿脉只收一次。'};
    const equipment=[basic,...available];
    q('#equip').innerHTML=equipment.map(c=>{
      const on=(s.equipped||'')===c.id;
      return '<button class="equip-item" data-equip="'+c.id+'" aria-pressed="'+on+'" '+(!atStart?'disabled':'')+'>'+iconMarkup(cardIcon[c.id]||'cart')+'<span>'+c.name+'</span><span class="state">'+(on?'已装备':'装配')+'</span></button>';
    }).join('');
    q('#equip-desc').textContent=(equipment.find(c=>c.id===(s.equipped||''))||basic).description;
    q('#stock').innerHTML=stockMarkup('copper',s.wallet.copper,'铜矿')+stockMarkup('crystal',s.wallet.crystal,'蓝晶')+stockMarkup('plan',s.wallet.plans,'图纸');
    const cost=MineGame.upgradeCost(s);
    q('#craft').textContent=cost?'制作 1 节长轨（'+cost.copper+' 铜 · '+cost.crystal+' 晶）':'长轨已全部制成';
    q('#craft').disabled=!atStart || !cost || s.wallet.copper<cost.copper || s.wallet.crystal<cost.crystal;
    q('#redeem').hidden=!(s.wallet.plans>0 && s.owned.length<MineGame.cards.length);
    q('#redeem').textContent='图纸换卡（'+MineGame.redeemCost+' 张）';
    q('#redeem').disabled=!atStart || s.wallet.plans<MineGame.redeemCost;
    q('#save-status').textContent=game.storageOK?'进度保存在此浏览器。':'浏览器存储当前不可用，进度仅在本次打开时保留。';
    paintIcons(q('.tools'));
    if(!moving) render(performance.now());
  }

  function warn(text) {
    refresh();
    q('#hint').textContent=text; q('#hint').classList.add('warn');
  }

  function moveTo(x,y) {
    if(animation || modal.open || game.state.phase!=='plan')return;
    const s=game.state,tip=s.path[s.path.length-1];
    if(same(tip,{x,y}))return;
    const previousLength=s.path.length,previous=cachedPreview;
    feedback.unselect();
    const result=game.move(x,y);
    if(!result.ok){warn(result.reason);return;}
    const removed=game.state.path.length<previousLength;
    if(removed)feedback.clear();
    const reinforced=!removed && game.trackCost(x,y)===2;
    tone(removed?180:reinforced?135:270+(game.state.path.length%6)*24,.075,'square',.045);if(!removed)tone(820,.035,'triangle',.035,.025);
    refresh(reinforced?'碎岩已加固，耗用 2 节轨道。':'',removed?null:previous);
  }

  function undo(){
    if(animation || modal.open || game.state.phase!=='plan')return;
    feedback.clear();
    const result=game.undo();
    if(!result.ok){warn(result.reason);return;}
    tone(180);refresh();
  }

  let exitAnimation=false;
  function launch(){
    if(animation || modal.open)return;
    if(game.state.phase==='done'){
      if(game.state.result.dig==='pending')openDig();else nextRound();
      return;
    }
    feedback.clear();
    const response=game.dispatch();
    if(!response.ok){warn(response.reason);return;}
    chord([125,185,247]);impact(board);
    animation={started:performance.now(),result:response.result,interval:reducedMotion?70:205};
    drawnCell=-1;exitAnimation=false;refresh();
  }

  function returnFrame(v,steps,t){
    const n=Math.min(Math.floor(t),steps.length-1),p=Math.min(1,t-n);
    const current=steps[n], next=steps[Math.min(n+1,steps.length-1)];
    const dir=next.x>current.x?'right':next.x<current.x?'left':next.y>current.y?'down':'up';
    v.cart={x:current.x+(next.x-current.x)*p,y:current.y+(next.y-current.y)*p,dir};
    v.moves=[];v.returning=true;
    v.collected=steps.slice(0,n+1).flatMap(step=>step.ores);
    v.effects=current.ores.map(o=>({from:o,to:v.cart,progress:p,type:o.type,amount:o.amount}));
    return n;
  }

  function render(now){
    if(!cachedView)return;
    const v={...cachedView}, a=animation;
    if(a){
      const steps=a.result.steps;
      let t=Math.max(0,((a.pauseTime??now)-a.started)/a.interval);
      if(!excavation && game.state.result?.dig==='pending' && t>=a.result.relicStep){
        t=a.result.relicStep;
        a.pauseTime=a.started+t*a.interval;
        openDig();
      }
      const n=returnFrame(v,steps,t);
      const current=steps[n];
      if(n!==drawnCell){
        drawnCell=n;const counts={copper:0,crystal:0};
        v.collected.forEach(o=>counts[o.type]+=o.amount);
        drawOrder(game.state,counts);
        if(current.ores.length){const f=440+([0,2,4,7,9,12][(v.collected.length-1)%6])*27;chord([f,f*1.5,f*2]);impact(board);}else tone(105,.045,'triangle',.025);
      }
      if(t>=steps.length+0.7 && !exitAnimation){
        exitAnimation=true;
        queueMicrotask(()=>{animation=null;refresh();chord(a.result.met?[392,523,659,784]:[330,247,165]);showResult();});
      }
    }
    feedback.apply(v,now);
    MineArt.drawBoard(ctx,v,reducedMotion?0:now);
  }

  function tick(now){
    if(excavation && !document.hidden)displayMeter(now);
    if(!q('#campaign-view').hidden && !document.hidden && (animation || (!reducedMotion && now-lastFrame>(feedback.pulsing?32:90)))){
      render(now);lastFrame=now;
    }
    requestAnimationFrame(tick);
  }

  function modalContent(title,body,buttons){
    if(!modal.open)modalReturnFocus=document.activeElement;
    q('#modal-inner').innerHTML='<h2 id="modal-title">'+title+'</h2>'+body+'<div class="modal-actions">'+buttons+'</div>';
    paintIcons(modal);if(!modal.open)modal.showModal();
    q('#modal [data-close]')?.addEventListener('click',()=>modal.close());
    q('#modal .primary')?.focus({preventScroll:true});
    modal.scrollTop=0;
  }
  const closeButton='<button class="control primary" data-close>知道了</button>';

  function finaleMarkup(won){
    const outcome=won?'win':'loss';
    const caption=won?'走上人生巅峰':'倾家荡产';
    const description=won?'矿工放下矿箱，开着敞篷跑车冲上山顶。':'仓库见底，矿工守着空矿车和一张欠单。';
    return '<figure class="finale-scene '+outcome+'"><canvas width="320" height="128" data-finale="'+outcome+
      '" role="img" aria-label="'+description+'"></canvas><figcaption>'+caption+'</figcaption></figure>';
  }

  function playFinale(dialog){
    const canvas=dialog.querySelector('canvas[data-finale]');
    const outcome=canvas.dataset.finale;
    const motion=matchMedia('(prefers-reduced-motion: reduce)');
    const duration=outcome==='win'?3800:2700;
    const start=performance.now();
    let lastFrame=-1;
    function frame(now){
      if(!dialog.open || !canvas.isConnected)return;
      const progress=motion.matches?1:Math.min(1,Math.max(0,(now-start)/duration));
      const frameIndex=Math.floor(progress*duration*24/1000);
      if(frameIndex!==lastFrame || progress===1){
        MineFinaleArt.draw(canvas,outcome,progress);
        lastFrame=frameIndex;
      }
      if(progress<1)requestAnimationFrame(frame);
    }
    frame(start);
    tone(outcome==='win'?660:148,.17);
  }

  function aimPosition(now){
    if(excavation.manual)return excavation.position;
    const sweep=((now-excavation.started)/excavation.period)%2;
    return sweep<=1?sweep:2-sweep;
  }

  function displayMeter(now){
    if(excavation.resolved)return;
    const pos=aimPosition(now);
    excavation.needle.style.left=(pos*100)+'%';
    excavation.meter.dataset.hit=String(pos>=excavation.left && pos<=excavation.right);
  }

  function openDig(){
    const s=game.state;
    if(excavation || !s.relic || s.result?.dig!=='pending')return;
    const width=s.round<=3?.36:s.round<=7?.29:.24;
    const left={fern:.27,amber:.53,shell:.39}[s.relic.id];
    const manual=reducedMotion;
    const controls=manual?'<div class="aim-control"><button class="quiet" id="aim-left">← 左移</button><button class="quiet" id="aim-right">右移 →</button></div>':'';
    modalContent('矿壁里有东西',
      '<div class="dig-display">'+iconMarkup('relic')+'</div><p>'+
      (manual?'用左右键或下方按钮移动指针，对准金纹后敲击。':'矿车已停稳。等白色指针扫到金纹时敲击，它会来回摆动。')+
      '</p><div class="dig-meter" id="dig-meter" aria-label="敲击瞄准条"><span class="dig-band" style="left:'+
      (left*100)+'%;width:'+(width*100)+'%"></span><span class="dig-needle"></span></div>'+controls,
      '<button class="control" id="dig-skip">直接回程</button><button class="control primary" id="dig-strike">敲击矿壁</button>');
    excavation={left,right:left+width,started:performance.now(),period:s.round<=3?1280:1030,manual,position:.1,
      resolved:false,meter:q('#dig-meter'),needle:q('.dig-needle')};
    displayMeter(performance.now());
    if(manual){
      q('#aim-left').onclick=()=>adjustAim(-.1);
      q('#aim-right').onclick=()=>adjustAim(.1);
    }
    q('#dig-strike').onclick=()=>{
      const pos=aimPosition(performance.now());
      finishDig(pos>=excavation.left && pos<=excavation.right);
    };
    q('#dig-skip').onclick=()=>finishDig(false,true);
  }

  function adjustAim(delta){
    if(!excavation?.manual || excavation.resolved)return;
    excavation.position=Math.max(0,Math.min(1,excavation.position+delta));
    displayMeter(performance.now());
  }

  function finishDig(hit,skipped=false){
    if(!excavation || excavation.resolved)return;
    const r=game.resolveDig(hit);

    if(!r.ok || skipped){continueReturn();return;}
    const item=specimen(game.state.relic.id);
    if(hit){chord([440,660,880]);cachedView.relicCollected=true;}
    else tone(145,.12);
    modalContent(hit?'发现'+item.name:'矿壳没有裂开',
      '<div class="dig-display">'+iconMarkup(hit?item.id:'relic')+'</div><p>'+
      (hit?item.description+' 已收入矿井藏品。':'这一锤偏离了金纹。订单矿石照常入库，以后重访还能再试。')+'</p>',
      '<button class="control primary" id="dig-continue">继续回程 →</button>');
    q('#dig-continue').onclick=continueReturn;
  }

  function continueReturn(){
    excavation=null;

      '<p>② 单点矿脉可查看产量，亮起的采位是可以贴轨收矿的位置。小矿出 1 份，矿簇出 2 份，富矿出 3 份。订单会显示整条路线预计收回的数量。</p>'+
      '<p>③ 第 3 关起有碎岩地面，踏入一格会消耗 2 节轨道。撤回这格，两节都会返还。</p>'+

  }

  function canVisit(s){
    return !animation && !excavation && ((s.phase==='plan' && s.path.length===1) ||
      (s.phase==='done' && s.result?.dig!=='pending'));
  }

  function visitLevel(level){
    feedback.clear();
    const result=game.visit(level);
    if(!result.ok){modal.close();warn(result.reason);return;}
    modal.close();refresh();board.focus({preventScroll:true});
  }

  function wireVisits(){
    modal.querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>visitLevel(Number(b.dataset.visit)));
  }

  function showMuseum(selected){
    const s=game.state;
    const entries=specimens.map(item=>{
      const owned=s.collection.includes(item.id);
      const sites=campaign.flatMap((stage,i)=>stage.relic?.id===item.id?[i+1]:[]);
      const usable=sites.find(n=>n<=s.frontier && n!==s.round);
      let detail=owned?item.description:'在第 '+sites.join('、')+' 关的发光岩壁可以找到它。';
      if(!owned && s.relic?.id===item.id)detail='本关有它的痕迹。贴着发光岩壁铺轨，回程时敲开矿壳。';
      const jump=!owned && usable && canVisit(s)?'<button class="quiet visit" data-visit="'+usable+'">去第 '+usable+' 关</button>':'';
      return '<div class="spec-entry '+(owned?'owned':'unknown')+'" id="entry-'+item.id+'">'+iconMarkup(item.id)+
        '<div><b>'+item.name+'</b> <small class="small">'+(owned?'已收藏':'待发掘')+'</small><p>'+detail+'</p>'+jump+'</div></div>';
    }).join('');
    modalContent('矿井藏品 · '+s.collection.length+'/'+specimens.length,entries,closeButton);
    wireVisits();
    if(selected)modal.querySelector('#entry-'+selected)?.scrollIntoView({block:'nearest'});
  }

  function showAtlas(){
    const s=game.state;
    const rows=campaign.map((stage,index)=>{
      const level=index+1;
      const current=level===s.round;
      const cleared=level<s.frontier;
      const golden=s.gold.includes(level);
      const status=golden?'★ 金轨':cleared?'已通过':current?'当前':level===s.frontier?'已解锁':'待解锁';
      const jump=level<=s.frontier && !current && canVisit(s);
      const record=s.bestRails[level]?(' · 纪录 '+s.bestRails[level]+' 轨'):'';
      const button=jump?'<button class="quiet visit" data-visit="'+level+'">'+(golden?'★ ':'')+(cleared?'重访':'出发')+'</button>':
        '<small class="'+(cleared?'cleared':'')+'">'+status+'</small>';
      return '<li'+(current?' aria-current="step"':'')+'><span class="num">'+String(level).padStart(2,'0')+
        '</span><div><b>'+stage.name+'</b><span class="order-target">'+oreText(stage.order)+
        ' · 标准矿斗最省 '+stage.par+' 轨'+record+'</span></div>'+button+'</li>';
    }).join('');
    const names=['小矿','矿簇','富矿'];
    const legend=names.map((name,index)=>'<span>'+iconMarkup('copper'+(index+1))+name+' ×'+(index+1)+'</span>').join('');
    const deep=s.frontier>campaign.length && s.round!==s.frontier && canVisit(s)?
      '<button class="quiet" data-visit="'+s.frontier+'">返回深层第 '+s.frontier+' 关</button>':'';

      '</ol>'+deep+'<p class="next-intro">铺轨前或回营后可以重访旧矿井，补齐藏品和金轨纪录。</p>',closeButton);
    wireVisits();
  }

  function showDeck(redeem){
    const s=game.state;
    const rows=MineGame.cards.map(c=>{
      const own=s.owned.includes(c.id);
      const choose=redeem && !own;
      return '<div class="card-reveal">'+iconMarkup(cardIcon[c.id])+' <strong>'+c.name+'</strong> · '+(own?'已收集':'待发现')+'<small>'+c.description+'</small>'+
        (choose?'<button class="quiet" data-redeem="'+c.id+'">兑换这张</button>':'')+'</div>';
    }).join('');

      '<p>每关首次满单免费抽一张，三张卡等概率，各占 1/3。重复卡转成 1 张图纸，'+MineGame.redeemCost+' 张图纸可换一张指定装备。</p>'+rows,closeButton);
    modal.querySelectorAll('[data-redeem]').forEach(b=>b.onclick=()=>{
      const result=game.redeem(b.dataset.redeem);

  function showResult(){
    const s=game.state,r=s.result;if(!r || animation)return;
    if(r.dig==='pending'){openDig();return;}
    const card=r.card && MineGame.cards.find(c=>c.id===r.card.id);
    let reward='';
    if(card){
      reward='<div class="card-reveal">'+iconMarkup(cardIcon[card.id])+' <b>'+card.name+'</b><small>'+
        (r.card.isNew?'新装备已收入卡册。'+card.description:'已持有这件装备，获得 1 张图纸。')+'</small></div>';
    }
    const missing={copper:Math.max(0,s.order.copper-r.copper),crystal:Math.max(0,s.order.crystal-r.crystal)};
    const orderLine=r.met?(card?'订单已交齐，获得一次免费抽卡。':'重访订单已交齐。'):'还差 '+oreText(missing)+'。重试时可以重新规划这张地图。';
    const used=game.used(), minimum=game.par();
    const target=r.met && used===minimum?'★ 金轨章 · '+used+' 节满单，已是最短线路。':'这次铺了 '+used+' 节轨道，最短满单路线为 '+minimum+' 节。';
    const title=r.met?(s.round===campaign.length && r.firstClear?'主线通关！':'第 '+s.round+' 关完成！'):'第 '+s.round+' 关 · 交货不足';
    const ticket=r.ticketEarned?'<p class="new-model">获得 1 张勘探券，可查看隔一关的矿图。</p>':'';
    const upcoming=r.firstClear?'<div class="next-stop-header"><p class="next-intro">下一关 · '+
      (campaign[s.round]?.name||'深层矿区')+'</p><button class="quiet" id="result-scout">看图预装</button></div>':'';
    const find=r.dig==='found'?'<p>'+iconMarkup(s.relic.id)+' 新藏品 · '+specimen(s.relic.id).name+'</p>':'';
    let actions='<button class="control" data-close>看线路</button><button class="control primary" id="next">'+nextLabel(s)+'</button>';
    if(s.round<s.frontier && (r.dig==='miss' || !r.met)){
      actions=r.met?'<button class="control" id="retry">再挖一次</button><button class="control primary" id="next">'+nextLabel(s)+'</button>':
        '<button class="control" id="next">'+nextLabel(s)+'</button><button class="control primary" id="retry">再试本关</button>';
    }
    const lastStep=r.met?'':MineFeedback.lastStepHint(s);

    modalContent(title,finaleMarkup(r.met)+'<p>带回 <strong>'+oreText(r)+'</strong>，已存入工坊。</p><p>'+orderLine+'</p>'+advice+'<p>'+target+'</p>'+find+reward+ticket+upcoming,actions);
    if(q('#retry'))q('#retry').onclick=()=>visitLevel(s.round);
    q('#next').onclick=nextRound;
    playFinale(modal);
  }

  q('#audio span').textContent=soundOn?'音效开':'音效关';

  };
  function bindBoardPointer(canvas,allowed,place,feedback,onInspect){
    let pointer=null, lastCell='', tapOre=null;
    function position(event){
      const box=canvas.getBoundingClientRect();
      return {x:Math.floor((event.clientX-box.left)*8/box.width),y:Math.floor((event.clientY-box.top)*7/box.height)};
    }
    function visit(cell,first){
      if(key(cell)===lastCell)return;
      lastCell=key(cell);
      if(!first)tapOre=null;
      if(cell.x<0 || cell.y<0 || cell.x>=8 || cell.y>=7)return;
      const ore=feedback.at(cell.x,cell.y);
      if(ore){if(first)tapOre=ore;return;}
      place(cell.x,cell.y);
    }
    canvas.addEventListener('pointerdown',event=>{
      if(!event.isPrimary || event.button!==0 || !allowed())return;
      event.preventDefault();canvas.focus({preventScroll:true});
      pointer=event.pointerId;lastCell='';tapOre=null;
      canvas.setPointerCapture(pointer);visit(position(event),true);
    });
    canvas.addEventListener('pointermove',event=>{
      if(event.pointerId===pointer && allowed())visit(position(event),false);
    });
    canvas.addEventListener('pointerup',event=>{
      if(event.pointerId!==pointer)return;
      const ore=tapOre;
      pointer=null;tapOre=null;
      if(ore && same(ore,position(event)) && allowed()){
        feedback.toggle(ore);onInspect();
      }
    });
    canvas.addEventListener('lostpointercapture',event=>{
      if(event.pointerId===pointer){pointer=null;tapOre=null;}
    });
  }
  bindBoardPointer(board,()=>!animation && !modal.open && game.state.phase==='plan',moveTo,feedback,()=>refresh());
  document.addEventListener('keydown',e=>{
    if(q('#campaign-view').hidden)return;
    if(excavation?.manual && !excavation.resolved && ['ArrowLeft','ArrowRight'].includes(e.key)){
      e.preventDefault();adjustAim(e.key==='ArrowLeft'?-.1:.1);return;
    }
    if(modal.open || q('#fast-dialog').open || e.ctrlKey || e.metaKey || e.altKey)return;
    if(e.target.closest('button') && (e.key===' '||e.key==='Enter'))return;
    const map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
    if(map[e.key]){
      e.preventDefault();const path=game.state.path,head=path[path.length-1],delta=map[e.key];
      moveTo(head.x+delta[0],head.y+delta[1]);
    }else if(e.key==='Backspace'){e.preventDefault();undo();}
    else if(e.key===' '){e.preventDefault();if(!e.repeat)launch();}
  });
  modal.addEventListener('cancel',e=>{
    if(!excavation)return;
    e.preventDefault();
    if(excavation.resolved)continueReturn();else finishDig(false,true);
  });
  modal.addEventListener('close',()=>{
    if(modalReturnFocus?.isConnected && !modalReturnFocus.disabled) modalReturnFocus.focus({preventScroll:true});
  });
  window.MineInterface={iconMarkup,paintIcons,tone,makeBoardView,returnFrame,bindBoardPointer,makeOreFeedback,dispatchLabel,orderMarkup,oreText,finaleMarkup,playFinale,
    campaign:game,
    fossilAlbum:()=>specimens.map(item=>({id:item.id,name:item.name,owned:game.state.collection.includes(item.id)})),
    canLeave:()=>!modal.open && !animation,showCampaignHelp:showHelp,
    resumeCampaign(){if(game.state.phase==='done' && game.state.result?.dig==='pending' && !modal.open)showResult();},
    setPaint(value){cartPaint=value;updateView(game.state);if(!animation)render(performance.now());}};
  paintTitle();paintIcons();refresh();requestAnimationFrame(tick);
  if(game.state.phase==='done' && location.hash!=='#express')showResult();
})();

</script>
<script>
/* Short- and long-range mine surveys, shared by the campaign and express run. */
(() => {
  'use strict';
  const start={x:0,y:3};
  const tileNames={ground:'floor',rock:'wall',copper:'copper',crystal:'crystal'};
  const cardIcons={long:'rail',coil:'copper',lens:'crystal'};
  const cardEffects={standard:'贴边采矿',long:'多带 2 节轨道',coil:'斜角也收铜矿',lens:'斜角也收蓝晶'};
  const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=id=>'<canvas width="16" height="16" class="scout-icon" data-scout-icon="'+escape(id)+'" aria-hidden="true"></canvas>';
  const at=(p,x,y)=>p && p.x===x && p.y===y;

  function mapSummary(map){
    const terrain={ground:'空地',rock:'岩壁',copper:'铜',crystal:'晶'};
    return map.board.map((row,y)=>{
      const description=row.map((tile,x)=>{
        if(at(start,x,y))return '起点';
        if(at(map.relic,x,y))return '藏品岩壁';
        if(map.rubble.some(p=>at(p,x,y)))return '碎岩';
        const amount=map.amounts[y][x];
        return terrain[tile]+(amount?'×'+amount:'')+(at(map.jade,x,y)?'含玉料':'')+(at(map.oddity,x,y)?'含钢筋':'');
      });
      return '第'+(y+1)+'行，从左到右为'+description.join('、')+'。';
    }).join(' ');
  }

  function drawMap(canvas,map,options,number){
    const collection=options.engine.state.collection||[];
    MineArt.drawBoard(canvas.getContext('2d'),{
      tiles:map.board.map(row=>row.map(tile=>tileNames[tile])),
      amounts:map.amounts,rubble:map.rubble,relic:map.relic,
      oddity:map.oddity,jade:map.jade,start,path:[start],cart:start,paint:options.paint,
      zone:options.express?number-1:(number<=3?0:number<=7?1:2),
      express:options.express,relicCollected:map.relic && collection.includes(map.relic.id)
    },0);
  }

  function legend(map){
    const keys=[[icon('cart'),'起点'],['<i class="scout-wall-dot" aria-hidden="true"></i>','岩壁']];
    if(map.board.some(row=>row.includes('copper')))keys.push([icon('copper'),'铜矿']);
    if(map.board.some(row=>row.includes('crystal')))keys.push([icon('crystal'),'蓝晶']);
    if(map.rubble.length)keys.push([icon('rubble'),'碎岩 2 轨']);
    if(map.relic)keys.push([icon('relic'),'藏品壁']);
    if(map.oddity)keys.push([icon('rebar'),'钢筋']);
    if(map.jade)keys.push([icon('jade'),'玉料']);
    return '<ul class="scout-legend" aria-label="地形图例">'+keys.map(([mark,text])=>'<li>'+mark+text+'</li>').join('')+'</ul>';
  }

  function loadout(state,number){
    const plan=state.plannedEquipment || {};
    const set=Object.prototype.hasOwnProperty.call(plan,number);
    const selected=set?plan[number]:state.equipped;
    const standard={id:null,name:'标准矿斗'};
    const cards=[standard,...MineGame.cards.filter(card=>state.owned.includes(card.id))];
    const name=(cards.find(card=>card.id===selected)||standard).name;
    const buttons=cards.map(card=>'<button class="quiet scout-gear" data-prepare="'+(card.id||'')+
      '" aria-pressed="'+(card.id===selected)+'">'+icon(cardIcons[card.id]||'cart')+'<span><b>'+escape(card.name)+
      '</b><small>'+cardEffects[card.id||'standard']+'</small></span></button>').join('');
    return '<div class="scout-action"><h3>为第 '+number+' 关预装</h3><div class="scout-gear-list">'+buttons+
      '</div><p class="scout-detail">'+(set?'已预装':'当前沿用')+' · '+escape(name)+'</p></div>';
  }

  function upgrades(options,offset,state){
    if(offset!==1 || state.phase!=='offer' || typeof options.advance!=='function'){
      const text=offset===1?'到站交货后可选择加价券或备用轨。':'抵达前一站并交货后，可选这张地图的改装。';
      return '<p class="scout-detail">'+text+'</p>';
    }
    const steel=Boolean(state.result?.foundRebar);
    return '<div class="scout-action"><h3>选好改装，直接续运</h3><div class="scout-upgrades">'+
      '<button class="scout-upgrade" data-scout-bonus="double">'+icon('voucher')+'<span><b>加价券</b><small>铜矿和蓝晶卖双倍</small></span></button>'+
      '<button class="scout-upgrade" data-scout-bonus="rail">'+icon('spare')+'<span><b>备用轨</b><small>本站多 1 节轨</small></span></button></div>'+
      (steel?'<p class="scout-detail">'+icon('rebar')+' 上站捡到的螺纹钢随车再加 1 节轨。</p>':'')+'</div>';
  }

  function mapMarkup(result,options,offset){
    const {map,number}=result;
    const stage=map.stage,order=map.order;
    const unit=options.express?'站':'关';
    const manifest=[order.copper?icon('copper')+'铜 '+order.copper:'',order.crystal?icon('crystal')+'晶 '+order.crystal:''].filter(Boolean);
    const seconds=options.express?MineExpress.durations[number-1]:null;
    const action=options.express?upgrades(options,offset,options.engine.state):loadout(options.engine.state,number);
    return '<div class="scout-stage"><h3>第 '+number+' '+unit+' · '+escape(stage.name)+'</h3><div class="scout-stats">'+
      '<span aria-label="订单">货单　'+manifest.join('　')+'</span><span>'+icon('rail')+'基础 '+stage.budget+' 轨</span>'+
      (seconds?'<span>'+icon('bell')+seconds+' 秒</span>':'')+'</div></div>'+
      '<div class="scout-chart"><canvas id="scout-map" width="320" height="280" role="img" aria-label="'+
      escape(stage.name)+'勘探图，出发点在左边第四行" aria-describedby="scout-description"></canvas></div>'+
      '<div id="scout-description" class="sr">'+escape(mapSummary(map))+'</div>'+legend(map)+action;
  }

  function lockedMarkup(result,options){
    const state=options.engine.state,unit=options.express?'站':'关';
    const enough=state.surveyTickets>0;
    return '<section class="scout-sealed">'+icon('ticket')+'<h3>第 '+result.number+' '+unit+'的矿图待勘探</h3>'+
      '<p>用 1 张勘探券揭开这张地图，之后可反复查看。</p>'+
      '<button id="scout-spend" class="control primary"'+(enough?'':' disabled')+'>'+
      (enough?'确认用 1 张券勘探':'需要 1 张勘探券')+'</button></section>';
  }

  function open(options,initialOffset=1){
    const {engine,express}=options;
    const source=express?'每累计完成 3 站快运交货，可得 1 张券。':'首次通过第 3、6、9… 关，各得 1 张券。';
    const unit=express?'站':'矿';
    const initial=initialOffset===2?2:1;

    function render(offset,message='',focusSelector=''){
      const previousScroll=focusSelector?document.getElementById('fast-dialog')?.scrollTop||0:0;
      const query=engine.scout(offset);
      const ticketCount=engine.state.surveyTickets;
      const tab=(n,name)=>'<button role="tab" id="scout-tab-'+n+'" data-scout-offset="'+n+'" aria-selected="'+
        (offset===n)+'" tabindex="'+(offset===n?'0':'-1')+'" aria-controls="scout-content">'+name+'</button>';
      let content;
      if(query.ok)content=mapMarkup(query,options,offset);
      else if(query.locked)content=lockedMarkup(query,options);
      else content='<div class="scout-empty">'+icon('bell')+'<p>'+escape(query.reason||'当前没有可勘探的地图')+'</p></div>';
      const body='<section id="scout-panel"><div class="scout-toolbar"><div role="tablist" aria-label="勘探距离" class="scout-tabs">'+
        tab(1,'下一'+unit+' · 免费')+tab(2,'隔一'+unit)+'</div><span class="scout-wallet">'+icon('ticket')+
        '券 <b>'+ticketCount+'</b></span></div><div id="scout-content" role="tabpanel" aria-labelledby="scout-tab-'+offset+'">'+
        content+'</div><p class="scout-source">'+source+'</p>'+(message?'<p class="scout-feedback" role="status">'+escape(message)+'</p>':'')+'</section>';
      const backLabel=options.backLabel || (express && engine.state.phase==='offer'?'返回站间选择':'返回矿区');
      options.show('矿道勘探',body,'<button class="control" id="scout-close">'+escape(backLabel)+'</button>');
      const panel=document.getElementById('scout-panel');
      if(!panel)return;
      if(query.ok)drawMap(panel.querySelector('#scout-map'),query.map,options,query.number);
      panel.querySelectorAll('[data-scout-icon]').forEach(canvas=>{
        MineArt.drawIcon(canvas.getContext('2d'),canvas.dataset.scoutIcon);
      });
      for(const button of panel.querySelectorAll('[data-scout-offset]')){
        button.onclick=()=>render(Number(button.dataset.scoutOffset));
        button.onkeydown=e=>{
          if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
          e.preventDefault();e.stopPropagation();
          render(e.key==='Home'?1:e.key==='End'?2:3-Number(button.dataset.scoutOffset));
        };
      }
      const spend=panel.querySelector('#scout-spend');
      if(spend)spend.onclick=()=>{
        const response=engine.revealScout();
        render(2,response.ok?'远处矿图已揭开。':response.reason);
      };
      panel.querySelectorAll('[data-prepare]').forEach(button=>{
        button.onclick=()=>{
          const id=button.dataset.prepare||null;
          const response=engine.prepareEquip(id,query.number);
          render(offset,response.ok?'装备将在进入第 '+query.number+' 关时生效。':response.reason,
            '[data-prepare="'+(id||'')+'"]');
        };
      });
      panel.querySelectorAll('[data-scout-bonus]').forEach(button=>{
        button.onclick=()=>options.advance(button.dataset.scoutBonus);
      });
      document.getElementById('scout-close').onclick=options.close;
      if(previousScroll)panel.closest('dialog').scrollTop=previousScroll;
      (panel.querySelector(focusSelector||'#scout-tab-'+offset))?.focus({preventScroll:true});
    }
    render(initial);
  }

  window.MineScout={open};
})();

</script>
<script>
/* 三站快运 · 触屏、时钟、结账和车库 */
(() => {
  'use strict';
  const ui=window.MineInterface;
  const engine=window.MineExpress.create();
  const q=selector=>document.querySelector(selector);
  const board=q('#fast-board'),ctx=board.getContext('2d');
  const dialog=q('#fast-dialog');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let active=false;
  let animation=null;
  let boardView,plannedPreview;
  const feedback=ui.makeOreFeedback(engine,reduced);
  let visibleSecond=null;
  let lastDraw=0;
  let raf=0;
  let sheet='';
  let modalFocus=null;

  const s=()=>engine.state;
  function met(counts){
    return counts.copper>=s().order.copper && counts.crystal>=s().order.crystal;
  }
  function sale(counts){
    return (counts.copper*2+counts.crystal*4)*(s().bonus==='double'?2:1);
  }
  function paintName(){
    return s().paint==='standard'?'default':s().paint;
  }
  function prices(){
    return s().bonus==='double'?'铜 4 币 · 晶 8 币':'铜 2 币 · 晶 4 币';
  }

  function clock(nowMs){
    const state=s(), duration=MineExpress.durations[state.station-1]*1000;
    const seconds=Math.ceil(nowMs/1000);
    if(seconds!==visibleSecond){
      q('#fast-time').textContent=seconds+'s';
      q('.fast-clock').classList.toggle('urgent',seconds<=5 && state.started && state.phase==='plan');
      if(visibleSecond!==null && seconds>=1 && seconds<=4 && state.started && !state.paused && state.phase==='plan')ui.tone(340,.045);
      visibleSecond=seconds;
    }
    q('#fast-time-bar').style.transform='scaleX('+Math.max(0,Math.min(1,nowMs/duration))+')';
  }

  function refresh(message='',previous=null){
    const state=s(),plan=state.phase==='plan',planned=engine.preview(),counts=state.result||planned;
    plannedPreview=planned;
    const gain=previous?feedback.add(previous,planned):'';
    boardView=ui.makeBoardView(engine,planned,state.station-1,paintName());
    boardView.express=true;
    boardView.oddity=state.oddity;
    boardView.jade=state.jade;
    if(!plan && !animation && state.result){
      boardView.cart=state.path[0];boardView.collected=state.result.steps.flatMap(step=>step.ores);
    }
    q('#fast-name').textContent=state.stage.name;
    q('#fast-stage').textContent='第 '+state.station+' / 3 站';
    q('#fast-no').textContent='No. '+String(state.run).padStart(3,'0');
    q('#fast-rails').textContent=state.budget-engine.used();
    q('#fast-time-label').textContent=!plan?'已发车':state.started?'发车铃':'首步起计';
    const order=q('#fast-ores');
    order.innerHTML=ui.orderMarkup(state,counts);
    ui.paintIcons(order);
    q('#fast-quote').textContent=(state.result?state.result.fare:sale(counts))+' 币';
    q('#fast-pot').textContent=state.pot;
    q('#fast-coins').textContent=state.coins;
    q('#fast-best').textContent=state.best+' 币';
    q('#fast-bonus').innerHTML=ui.iconMarkup(state.bonus==='double'?'voucher':state.bonus==='rail'?'spare':'coin')+' '+
      (state.bonus==='double'?'加价券生效 · ':state.bonus==='rail'?'备用轨生效 · +1 轨 · ':'')+prices()+
      (state.rebarRail?'<div class="steel-line">'+ui.iconMarkup('rebar')+' 螺纹钢改轨 · 再加 1 格</div>':'');
    ui.paintIcons(q('#fast-bonus'));
    const first=state.jade?'点矿看采位。贴着青绿原石铺轨，满单能带回玉。':'点矿看采位。铺第一格才开始倒计时。';
    let note=planned.foundJade?'这条线路能捎回玉石。交齐订单，可卖 48 币或自己开石。':
      planned.foundRebar?'这块铜矿夹着螺纹钢。满单续运，下一站额外 +1 轨。':
      met(planned)?'货单已齐。现在发车，或再多捎些矿。':'铃响会自动发车，先让线路贴齐订单里的矿。';
    if(!state.started && plan)note=first;
    if(!plan)note={offer:state.result?.jade==='pending'?'本站已交货，还有一块玉石原石等你处理。':'本站已交货。可以收车落袋，或选道具去下一站。',banked:'本趟货款已入账，可在收藏车库换车。',lost:'本趟结束。重新开车会换一条首站路线。'}[state.phase];
    q('#fast-note').textContent=message || feedback.note || gain || note;
    q('#fast-save').textContent=engine.storageOK?'快运进度已保存在此浏览器。':'当前浏览器仅能在本次打开时保留进度。';
    q('#fast-undo').disabled=!plan || state.path.length<2 || Boolean(animation);
    q('#fast-go').disabled=Boolean(animation) || (plan && state.path.length<2);
    q('#fast-yard').disabled=Boolean(animation);q('#fast-scout').disabled=Boolean(animation);
    const shortage=MineFeedback.shortage(state.order,planned);
    const go=q('#fast-go');
    if(plan && state.path.length>1 && !animation){
      ui.dispatchLabel(go,shortage?'缺货发车 · 本趟结束':'满单发车 · '+sale(planned)+' 币',shortage?'short':'ready',
        shortage || '整车矿石可售出');
    }else ui.dispatchLabel(go,animation?'正在返程…':plan?'发车交货':
      state.phase==='offer'?(state.result?.jade==='pending'?'处理玉石原石 →':'领取货款或继续 →'):'查看本趟结算 →');
    clock(engine.remaining());
    render(performance.now());
  }

  function openSheet(kind,title,body,buttons){
    sheet=kind;
    q('#fast-dialog-inner').innerHTML='<h2 id="fast-dialog-title">'+title+'</h2>'+body+'<div class="modal-actions">'+buttons+'</div>';
    ui.paintIcons(dialog);
    if(!dialog.open){modalFocus=document.activeElement;dialog.showModal();}
    dialog.scrollTop=0;
    (dialog.querySelector('.primary') || dialog.querySelector('button'))?.focus({preventScroll:true});
    const close=dialog.querySelector('[data-fast-close]');
    if(close)close.onclick=()=>dialog.close();
  }

  function resumeClock(){
    if(active && !document.hidden && !dialog.open && s().phase==='plan'){
      const action=engine.resume();
      if(action.expired)beginReturn(action);
    }
  }

  function pauseClock(){
    if(s().phase!=='plan' || s().paused)return;
    const action=engine.pause();
    if(action.expired && active)beginReturn(action);
  }

  function info(title,body){
    if(animation)return;
    pauseClock();
    if(animation)return;
    openSheet('info',title,body,'<button class="control primary" data-fast-close>回矿区</button>');
  }
  function showRules(){
    info('三站快运怎么玩','<p>一趟最多三站，发车铃分别在 24、21、18 秒后响。点矿能看品级、产量和采位，第一格轨道落下才开始读秒。铃响时，矿车会按当前线路自动回程。</p>'+
      '<p>交齐订单，整车矿都能卖。前两站可以当场落袋，也可以从加价券和备用轨中选一件，带着货款继续跑。</p>'+
      '<p>勘探时倒计时暂停。下一站的矿图免费，隔一站用一张勘探券。每累计交货三站会获得一张新券。</p>'+
      '<p>缺货就结束这一趟，随车货款会损失。已落袋的矿币、车型和收藏记录永久保留。第三站成功会自动落袋。</p>'+
      '<p>留意铜矿旁露出的螺纹钢。满单带回并继续跑，下一站额外多一节轨。它还能与备用轨叠加。</p>'+
      '<p>有些矿脉夹着青绿色的玉石原石。交齐订单可以直接卖给商家，或自己切开，按开出的价格卖。玉款随车，加价券只对铜矿和蓝晶生效。</p>');
  }

  function vehicleCards(state){
    const progress=MineExpress.albumProgress(state.album);
    return '<div class="vehicle-grid">'+MineExpress.paints.map(model=>{
      const current=model.id===state.paint, owned=state.paints.includes(model.id);
      const locked=!owned && (model.milestone || state.coins<model.price);
      let detail=current?'正在驾驶':owned?'换上这辆车':model.price+' 币兑换并换上';
      if(!owned && model.milestone){
        detail=model.requirement+' · '+Math.min(progress[model.milestone],model.target)+'/'+model.target;
      }
      return '<button class="vehicle-card" data-paint="'+model.id+'" aria-pressed="'+current+'" '+
        (current||locked?'disabled':'')+'><canvas data-model="'+model.id+'" width="80" height="64" aria-hidden="true"></canvas>'+
        '<b>'+model.name+'</b><small>'+detail+'</small></button>';
    }).join('')+'</div>';
  }

  function albumView(album){
    const names={20:'石皮偏厚',40:'浅青细纹',80:'浓翠透光',100:'满翠通透'};
    const cuts=MineExpress.jadeCuts.map(({value})=>{
      const count=album.cuts[value];
      return '<li class="'+(count?'found':'unseen')+'">'+ui.iconMarkup('jade-cut')+
        '<b>'+names[value]+'</b><span>'+value+' 币 · '+(count?'×'+count:'未开出')+'</span></li>';
    }).join('');
    const fossils=ui.fossilAlbum().map(item=>'<li class="'+(item.owned?'found':'unseen')+'">'+
      ui.iconMarkup(item.id)+'<b>'+item.name+'</b><span>'+(item.owned?'已收藏':'待发掘')+'</span></li>').join('');
    return '<p class="album-stats">快运累计交货 <b>'+album.deliveries+'</b> 站 · 整块出售 <b>'+album.sold+
      '</b> 次</p><h3 class="album-label">玉石切面 · '+MineExpress.albumProgress(album).grades+
      ' / 4</h3><ul class="album-grid">'+cuts+'</ul><h3 class="album-label">主线化石</h3><ul class="album-grid fossils">'+fossils+'</ul>';
  }

  function openYard(tab='models'){
    if(animation)return;
    if(active){pauseClock();if(animation)return;}
    const state=s(), album=tab==='album';
    const tabs='<div class="yard-tabs" aria-label="车库视图"><button data-yard-tab="models" aria-pressed="'+!album+
      '">车型 · '+state.paints.length+'/'+MineExpress.paints.length+'</button><button data-yard-tab="album" aria-pressed="'+album+'">收藏图鉴</button></div>';
    const equipped=MineExpress.paints.find(model=>model.id===state.paint);
    const body=album?albumView(state.album):'<p class="yard-summary">当前驾驶 <strong>'+equipped.name+'</strong> · 余额 '+state.coins+
      ' 币</p>'+vehicleCards(state)+'<p class="jade-foot">所有车型共用采矿数值，可在主线和快运中驾驶。</p>';
    openSheet('yard','收藏车库',tabs+body,'<button class="control primary" data-fast-close>回矿区</button>');
    dialog.querySelectorAll('[data-model]').forEach(canvas=>{
      MineArt.drawVehicle(canvas.getContext('2d'),canvas.dataset.model,canvas.width,canvas.height);
    });
    dialog.querySelectorAll('[data-yard-tab]').forEach(button=>{
      button.onclick=()=>{openYard(button.dataset.yardTab);dialog.querySelector('[data-yard-tab][aria-pressed="true"]').focus({preventScroll:true});};
    });
    dialog.querySelectorAll('[data-paint]').forEach(button=>{
      button.onclick=()=>{
        const action=engine.buyPaint(button.dataset.paint);
        if(!action.ok){openYard();return;}
        ui.setPaint(paintName());ui.tone(560,.14);refresh();openYard();
      };
    });
  }

  function openScout(fromOffer=false){
    if(animation)return;
    if(active){pauseClock();if(animation)return;}
    const close=()=>{if(fromOffer)showOutcome();else dialog.close();};
    MineScout.open({
      engine:active?engine:ui.campaign, express:active, paint:paintName(), close,
      backLabel:fromOffer?'返回站间选择':q('#modal').open?'返回结算':'返回矿区',
      show:(title,body,buttons)=>openSheet('scout',title,body,buttons),
      advance:fromOffer?startNext:null
    });
  }

  function showJade(){
    const offer=MineExpress.jadeOffer, cuts=MineExpress.jadeCuts;
    const odds=cuts.map(cut=>'<li><b>'+cut.value+' 币</b><span>'+cut.weight+'%</span></li>').join('');
    openSheet('jade','这块玉，卖还是开？',
      '<div class="jade-counter">'+ui.iconMarkup('jade')+'<div><small>商家回收价</small><strong>'+offer+' <em>币</em></strong></div></div>'+
      '<p>整块卖，商家出 '+offer+' 币。自己切，按切面的成色卖，开出的价就定了。</p>'+
      '<ul class="jade-odds" aria-label="开石售价及概率">'+odds+'</ul><p class="jade-foot">玉款装入本趟矿车，收车落袋时一起入账。</p>',
      '<button class="control" id="fast-jade-sell">直接卖 · '+offer+' 币</button><button class="control primary" id="fast-jade-cut">自己开石</button>');
    for(const method of ['sell','cut'])q('#fast-jade-'+method).onclick=()=>{
      const action=engine.resolveJade(method);
      refresh(action.ok?'':action.reason);
      if(action.ok){ui.tone(method==='cut'?730:480,.12);showOutcome();}
      else if(s().phase!=='plan')showOutcome();
      else dialog.close();
    };
  }

  function jadeReceipt(r){
    if(r.jade!=='sold' && r.jade!=='cut')return '';
    const cut=r.jade==='cut';
    const diff=r.jadeValue-MineExpress.jadeOffer;
    const title=cut?(diff<0?'切开只值 ':'切开值 '):'原石成交 · ';
    const comparison=diff===0?'和商家报价相同。':'比刚才的报价'+(diff<0?'少了':'多了')+Math.abs(diff)+' 币。';
    return '<div class="jade-receipt" role="status">'+ui.iconMarkup(cut?'jade-cut':'jade')+'<span><b>'+
      title+r.jadeValue+' 币</b><small>'+
      (cut?comparison:'按商家报价卖出。')+'玉款已装车。</small></span></div>';
  }

  function newModelNotice(state,r){
    if(!r.met)return '';
    const progress=MineExpress.albumProgress(state.album);
    const models=[];
    if(r.jadeValue && progress.jade===1)models.push('穿山甲钻车');
    if(state.album.deliveries===5)models.push('蒸汽邮车');
    if(r.jade==='cut' && progress.grades===4 && state.album.cuts[r.jadeValue]===1)models.push('金龙巡游车');
    const unlocked=models.length?'<p class="new-model">新车型已入库 · '+models.join('、')+'</p>':'';
    return unlocked+(r.ticketEarned?'<p class="new-model">累计交货奖励 · 勘探券 +1</p>':'');
  }

  function showOutcome(){
    const state=s(),r=state.result;
    if(!r || animation || !active)return;
    if(state.phase==='offer'){
      if(r.jade==='pending'){showJade();return;}
      const next=engine.nextStop(), steel=Boolean(r.foundRebar);
      const manifest='<div class="fast-ticket"><b>'+ui.oreText(r)+' · 本站 '+r.fare+' 币</b><div class="manifest">随车货款 '+state.pot+' 币，下一站缺货就会损失。</div></div>';
      const discovery=steel?'<div class="steel-find">'+ui.iconMarkup('rebar')+'<span><b>挖出了螺纹钢</b><small>谁把工地埋这儿了？续运时改成 1 节轨。</small></span></div>':'';
      const nextInfo='<div class="fast-choice"><div class="next-stop-header"><h3>下一站 · '+next.name+'</h3><button id="offer-scout" class="quiet">看勘探图</button></div><p class="desc">'+ui.oreText(next.order)+' · '+next.seconds+' 秒 · 基础 '+next.budget+' 轨</p></div>';
      const goods=buttonItem('double','voucher','加价券','下一站整车卖双倍。含金量还在上升。')+
        buttonItem('rail','spare','备用轨','下一站多铺 1 格'+(steel?'，加上捡来的钢料共多 2 格。':'。'));
      const bellNote=r.timeout?'<p class="desc">发车铃一响，矿车卡点下班。本站货已交齐。</p>':'';
      openSheet('offer','收车，还是再跑一站？',jadeReceipt(r)+newModelNotice(state,r)+manifest+discovery+bellNote+nextInfo+goods,
        '<button class="control primary" id="fast-bank">收车落袋 · '+state.pot+' 币</button>');
      q('#offer-scout').onclick=()=>openScout(true);
      q('#fast-bank').onclick=()=>{const res=engine.bank();if(!res.ok){dialog.close();refresh(res.reason);return;}refresh();showOutcome();};
      for(const item of ['double','rail'])q('#fast-'+item).onclick=()=>startNext(item);
    }else if(state.phase==='lost'||state.phase==='banked'){
      const paid=state.phase==='banked';
      const missing={copper:Math.max(0,state.order.copper-r.copper),crystal:Math.max(0,state.order.crystal-r.crystal)};
      const title=paid?(state.station===3?'三站全收！':'货款已落袋'):'这趟断单了';
      const reason=paid?'这趟存下 '+state.settled+' 币。':(r.timeout?'发车铃响了，':'发车时')+'还差 '+ui.oreText(missing)+'。';
      const detail=paid?'账上 '+state.coins+' 币 · 单趟最高 '+state.best+' 币':
        '本趟损失 '+state.lostFare+' 币 · 账上仍有 '+state.coins+' 币';
      let quip='';
      if(!paid && state.lostFare>0)quip='<p class="desc">“早知道上一站就收手了。”</p>';
      else if(!paid && r.copper+r.crystal===0)quip='<p class="desc">矿区空军，带回一车新鲜空气。</p>';
      else if(paid && r.timeout && state.station===3)quip='<p class="desc">卡点下班。这车矿，班味儿比矿味还重。</p>';
      const lastStep=paid?'':MineFeedback.lastStepHint(state);
      const advice=lastStep?'<p class="route-review">'+lastStep+'</p>':'';
      openSheet('result',title,ui.finaleMarkup(paid)+'<div class="fast-ticket"><b>'+reason+'</b><div class="manifest">'+detail+'</div></div>'+advice+quip+newModelNotice(state,r),
        '<button class="control" data-fast-close>看线路</button><button class="control primary" id="fast-again">'+(paid?'再开一趟 →':'重新开始')+'</button>');
      q('#fast-again').onclick=()=>{const res=engine.restart();dialog.close();refresh(res.ok?'':res.reason);board.focus({preventScroll:true});};
      ui.playFinale(dialog);
    }
  }
  function buttonItem(id,icon,name,detail){
    return '<button class="fast-item" id="fast-'+id+'">'+ui.iconMarkup(icon)+'<span><b>'+name+'</b><small>'+detail+'</small></span><span class="action">续运 →</span></button>';
  }
  function startNext(item){
    const res=engine.advance(item);
    dialog.close();refresh(res.ok?'':res.reason);
    if(res.ok){ui.tone(480);board.focus({preventScroll:true});}
  }

  function beginReturn(response){
    if(!response.result){if(!response.ok)refresh(response.reason);return;}
    if(animation)return;
    if(dialog.open)dialog.close();
    feedback.clear();
    animation={start:performance.now(),steps:response.result.steps,frame:-1};
    ui.tone(125,.13,'triangle',.08);ui.tone(247,.16,'triangle',.07,.10);
    refresh(response.result.timeout?'发车铃响，按当前线路交货。':'矿车正在沿原路收矿。');
  }

  function render(now){
    if(!boardView || !active)return;
    const v={...boardView};
    if(animation){
      const steps=animation.steps;
      const t=Math.max(0,(now-animation.start)/(reduced?45:140));
      const n=ui.returnFrame(v,steps,t);
      if(n!==animation.frame){if(steps[n].ores.length){ui.tone(420+24*n,.13);ui.tone(840+48*n,.15,'triangle',.055,.075);if(!reduced && board.animate)board.animate([{filter:'brightness(1.2)'},{filter:'brightness(1)'}],{duration:210});}else ui.tone(105,.04,'triangle',.025);}
      animation.frame=n;
      if(t>=steps.length+.4){
        animation=null;
        queueMicrotask(()=>{if(!active)return;refresh();showOutcome();});
      }
    }
    feedback.apply(v,now);
    MineArt.drawBoard(ctx,v,reduced?0:now);
  }
  function loop(now){
    raf=0;
    if(!active || document.hidden)return;
    if(s().phase==='plan' && !dialog.open){
      const action=engine.tick();
      if(!action.ok)refresh(action.reason);
      else if(action.expired)beginReturn(action);
      clock(engine.remaining());
    }
    if(animation || (!reduced && now-lastDraw>(feedback.pulsing?32:95))){render(now);lastDraw=now;}
    raf=requestAnimationFrame(loop);
  }
  function startLoop(){
    if(!raf && active && !document.hidden)raf=requestAnimationFrame(loop);
  }
  function move(x,y){
    if(!active || animation || dialog.open || s().phase!=='plan')return;
    const tip=s().path[s().path.length-1];
    if(tip.x===x && tip.y===y)return;
    const previous=plannedPreview,length=s().path.length;
    feedback.unselect();
    const action=engine.move(x,y);
    if(action.expired){beginReturn(action);return;}
    if(action.ok){
      if(s().path.length<length)feedback.clear();
      ui.tone(265+14*s().path.length,.075,'square',.045);
    }
    refresh(action.ok?'':action.reason,action.ok && s().path.length>length?previous:null);
  }
  function undo(){
    if(animation || dialog.open || s().phase!=='plan')return;
    feedback.clear();
    const action=engine.undo();
    if(action.expired){beginReturn(action);return;}
    if(action.ok)ui.tone(175);refresh(action.ok?'':action.reason);
  }
  function go(){
    if(animation || dialog.open)return;
    if(s().phase==='plan')beginReturn(engine.dispatch());else showOutcome();
  }

  function switchMode(toExpress){
    if(toExpress && !ui.canLeave())return;
    if(!toExpress && active)pauseClock();
    active=toExpress;
    q('#campaign-view').hidden=active;q('#campaign-yard').hidden=active;q('#save-status').hidden=active;q('#express-view').hidden=!active;
    q('#express-tab').setAttribute('aria-pressed',String(active));
    q('#campaign-tab').setAttribute('aria-pressed',String(!active));
    try{history.replaceState(null,'',active?'#express':location.pathname+location.search);}catch{}
    if(active){
      resumeClock();refresh();startLoop();
      if(s().phase!=='plan' && !animation)showOutcome();
    }else{
      cancelAnimationFrame(raf);raf=0;animation=null;
      ui.setPaint(paintName());
      ui.resumeCampaign();
    }
  }
  ui.bindBoardPointer(board,()=>active && s().phase==='plan' && !animation && !dialog.open,move,feedback,()=>refresh());
  document.addEventListener('keydown',e=>{
    if(!active || dialog.open || e.ctrlKey || e.altKey || e.metaKey)return;
    if(e.target.closest('button') && (e.key===' '||e.key==='Enter'))return;
    const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
    const d=dirs[e.key];
    if(d){e.preventDefault();const head=s().path[s().path.length-1];move(head.x+d[0],head.y+d[1]);}
    else if(e.key==='Backspace'){e.preventDefault();undo();}
    else if(e.key===' ' && !e.repeat){e.preventDefault();go();}
  });
  q('#fast-undo').onclick=undo;q('#fast-go').onclick=go;q('#fast-yard').onclick=()=>openYard();q('#campaign-yard').onclick=()=>openYard();
  q('#fast-scout').onclick=()=>openScout();q('#campaign-scout').onclick=()=>openScout();
  q('#modal').addEventListener('click',event=>{if(event.target.closest('#result-scout'))openScout();});
  q('#express-tab').onclick=()=>switchMode(true);q('#campaign-tab').onclick=()=>switchMode(false);
  q('#help').onclick=()=>active?showRules():ui.showCampaignHelp();
  dialog.addEventListener('cancel',event=>{
    if(sheet==='scout' && active && s().phase==='offer'){
      event.preventDefault();showOutcome();
    }
  });
  dialog.addEventListener('close',()=>{
    sheet='';resumeClock();
    if(modalFocus?.isConnected&&!modalFocus.disabled)modalFocus.focus({preventScroll:true});
  });
  document.addEventListener('visibilitychange',()=>{
    if(!active)return;
    if(document.hidden){pauseClock();cancelAnimationFrame(raf);raf=0;}
    else{resumeClock();refresh();startLoop();}
  });
  addEventListener('pagehide',()=>{if(active)pauseClock();});
  addEventListener('pageshow',()=>{if(active){resumeClock();refresh();startLoop();}});
  ui.setPaint(paintName());
  if(location.hash==='#express')switchMode(true);
  else if(s().started && s().phase==='plan')engine.pause();
})();

</script>
</body></html>
