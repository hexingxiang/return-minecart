<script>
/* 回程矿车 · 规则与存档 */
(() => {
  'use strict';

  const width = 8;
  const height = 7;
  const start = { x: 0, y: 3 };
  const steps4 = [[1, 0], [0, -1], [0, 1], [-1, 0]];
  const diagonals = [[1, 1], [-1, -1], [1, -1], [-1, 1]];
  const cards = [
    { id: 'long', name: '伸缩轨匣', description: '本趟多带 2 节轨道。' },
    { id: 'coil', name: '铜磁线圈', description: '回程还会拾取斜角的铜矿。' },
    { id: 'lens', name: '晶光透镜', description: '回程还会拾取斜角的水晶。' }
  ];
  const redeemCost = 3;
  const storageKey = 'huicheng-minecart.save.v3';
  const stageStorageKey = 'huicheng-minecart.save.v2';
  const oldStorageKey = 'huicheng-minecart.save.v1';
  const upgradeCosts = [
    { copper: 4, crystal: 1 },
    { copper: 7, crystal: 2 },
    { copper: 10, crystal: 3 }
  ];
  const glyphs = {
    '.': 'ground', '#': 'rock', c: 'copper', C: 'copper', O: 'copper',
    k: 'crystal', K: 'crystal', Q: 'crystal'
  };
  const grades = { c: 1, C: 2, O: 3, k: 1, K: 2, Q: 3 };
  const swapOre = { c: 'k', C: 'K', O: 'Q', k: 'c', K: 'C', Q: 'O' };

  const key = (p) => p.y * width + p.x;
  const same = (a, b) => a.x === b.x && a.y === b.y;
  const inside = (p) => Number.isInteger(p.x) && Number.isInteger(p.y) &&
    p.x >= 0 && p.x < width && p.y >= 0 && p.y < height;
  const touching = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1;
  const validCard = (id) => cards.some(card => card.id === id);
  const isOre = (cell) => cell === 'copper' || cell === 'crystal';
  const fail = reason => ({ ok: false, reason });
  const upgradeCost = state => upgradeCosts[state.upgrades] || null;

  function randomFor(seed) {
    let value = seed >>> 0;
    return () => {
      value = (value + 0x6d2b79f5) >>> 0;
      let t = Math.imul(value ^ value >>> 15, 1 | value);
      t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function around(p, directions = steps4) {
    return directions.map(([dx, dy]) => ({ x: p.x + dx, y: p.y + dy })).filter(inside);
  }

  function decodeStage(source, rows, endless) {
    return {
      board: rows.map(row => Array.from(row, mark => glyphs[mark])),
      amounts: rows.map(row => Array.from(row, mark => grades[mark] || 0)),
      order: { ...source.order }, rubble: [], relic: null,
      stage: { name: source.name, tip: source.tip, budget: source.budget, par: source.par, endless }
    };
  }

  function varyTerrain(rows, random) {
    const ground = [], minerals = [], rocks = [];
    const cells = rows.map(row => Array.from(row));
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        if (same(start, { x, y })) continue;
        const mark = cells[y][x];
        if (mark === '.') ground.push({ x, y });
        else if (mark === '#') rocks.push({ x, y });
        else minerals.push({ x, y });
      }
    }
    function relocate(sites) {
      if (!sites.length || !ground.length) return;
      const [from] = sites.splice(Math.floor(random() * sites.length), 1);
      const [to] = ground.splice(Math.floor(random() * ground.length), 1);
      cells[to.y][to.x] = cells[from.y][from.x];
      cells[from.y][from.x] = '.';
    }
    relocate(minerals);
    relocate(rocks);
    if (random() < 0.5) relocate(minerals);
    return cells;
  }

  // This generator also reconstructs in-flight v2 journeys from their saved seed.
  function makeBaseMap(seed, round) {
    const stages = window.MineLevels.stages.map((stage, i) => ({ ...stage, par: i + 1 }));
    if (round <= stages.length) {
      const source = stages[round - 1];
      return decodeStage(source, source.rows, false);
    }
    // Alternate late-game templates, then move their ore veins and rock walls.
    // Test each alternative against the base cart, so surplus upgrades stay optional.
    const random = randomFor(seed ^ Math.imul(round, 0x9e3779b1));
    const late = stages.slice(-3);
    const base = late[(round - stages.length - 1 + seed % late.length) % late.length];
    const source = { ...base, name: base.name + ' · 深层', tip: '矿脉的位置变了。先找高品位矿，再规划回程路线。' };
    let rows = base.rows.slice();
    if (random() < 0.5) rows.reverse();
    if (random() < 0.5) {
      rows = rows.map(row => Array.from(row, mark => swapOre[mark] || mark).join(''));
      source.order = { copper: base.order.crystal, crystal: base.order.copper };
    }
    for (let attempt = 0; attempt < 7; attempt++) {
      const map = decodeStage(source, varyTerrain(rows, random), true);
      const par = optimalLength({ ...map, equipped: null });
      if (par !== null && par >= Math.max(8, base.par)) {
        map.stage.par = par;
        return map;
      }
    }
    // Vertical reflection and mineral-type exchange preserve the original solution.
    return decodeStage(source, rows, true);
  }

  function trackCost(state, p) {
    return state.rubble.some(q => same(q, p)) ? 2 : 1;
  }

  function usedRails(state) {
    return state.path.slice(1).reduce((total, p) => total + trackCost(state, p), 0);
  }

  // A relic is always reachable on its own, including with the standard cart.
  function reachableWalls(map) {
    const distances = Array(width * height).fill(Infinity);
    const queue = [start];
    distances[key(start)] = 0;
    while (queue.length) {
      const p = queue.shift();
      for (const q of around(p)) {
        if (map.board[q.y][q.x] !== 'ground') continue;
        const cost = distances[key(p)] + trackCost(map, q);
        if (cost > map.stage.budget || cost >= distances[key(q)]) continue;
        distances[key(q)] = cost;
        queue.push(q);
      }
    }
    const walls = [];
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const wall = { x, y };
        if (map.board[y][x] === 'rock' && around(wall).some(q => !same(q, start) && Number.isFinite(distances[key(q)]))) {
          walls.push(wall);
        }
      }
    }
    return walls;
  }

  function placeRubble(map, random) {
    const floors = [];
    map.board.forEach((row, y) => row.forEach((type, x) => {
      if (type === 'ground' && !same(start, { x,y })) floors.push({ x,y });
    }));
    while (map.rubble.length < 3 && floors.length) {
      const [p] = floors.splice(Math.floor(random() * floors.length), 1);
      const candidate = { ...map, rubble: [...map.rubble, p], equipped: null };
      const par = optimalLength(candidate);
      if (par !== null) {
        map.rubble = candidate.rubble;
        map.stage.par = par;
      }
    }
  }

  function makeMap(seed, round, legacyTrip) {
    let map = makeBaseMap(seed, round);
    if (legacyTrip) return map;
    if (!map.stage.endless) {
      const stage = window.MineLevels.stages[round - 1];
      map.rubble = (stage.rubble || []).map(p => ({ ...p }));
      map.relic = stage.relic ? { ...stage.relic } : null;
      map.stage.par = stage.par;
      return map;
    }
    const random = randomFor(seed ^ Math.imul(round, 0x2c1b3c6d));
    placeRubble(map, random);
    // The eighth template can still have an eight-rail v2 solution. If rubble
    // leaves it that easy, the following deep template guarantees at least nine.
    if (map.stage.par < 9) {
      map = makeBaseMap(seed + 1, round);
      placeRubble(map, random);
    }
    const walls = reachableWalls(map);
    const relics = window.MineLevels.relics || [];
    if (walls.length && relics.length) {
      const wall = walls[Math.floor(random() * walls.length)];
      const index = (round - window.MineLevels.stages.length - 1 + seed % relics.length) % relics.length;
      map.relic = { ...wall, id: relics[index].id };
    }
    return map;
  }

  function pickupSites(state, p) {
    const sites = around(p).filter(q => isOre(state.board[q.y][q.x]));
    const diagonalType = { coil: 'copper', lens: 'crystal' }[state.equipped];
    if (diagonalType) {
      sites.push(...around(p, diagonals).filter(q => state.board[q.y][q.x] === diagonalType));
    }
    return sites;
  }

  function computeReturn(state) {
    const seen = new Set();
    const counts = { copper: 0, crystal: 0 };
    const steps = [];
    for (const p of state.path.slice().reverse()) {
      const ores = [];
      for (const q of pickupSites(state, p)) {
        const type = state.board[q.y][q.x];
        if (seen.has(key(q))) continue;
        seen.add(key(q));
        const amount = state.amounts[q.y][q.x];
        counts[type] += amount;
        ores.push({ ...q, type, amount });
      }
      steps.push({ ...p, ores });
    }
    const relicStep = state.relic ? steps.findIndex(p => !same(p, start) && touching(p, state.relic)) : -1;
    return { ...counts, steps, relicStep };
  }

  const parCache = new WeakMap();
  function optimalLength(state) {
    let cache = parCache.get(state.rubble);
    if (!cache) {
      cache = new Map();
      parCache.set(state.rubble, cache);
    }
    if (cache.has(state.equipped)) return cache.get(state.equipped);

    const size = width * height;
    const neighbours = Array.from({ length: size }, () => []);
    const pickups = Array.from({ length: size }, () => []);
    const costs = new Uint8Array(size).fill(1);
    for (const p of state.rubble) costs[key(p)] = 2;
    state.board.forEach((row, y) => row.forEach((type, x) => {
      if (type !== 'ground') return;
      const i = y * width + x;
      neighbours[i] = around({ x, y }).filter(p => state.board[p.y][p.x] === 'ground').map(key);
      pickups[i] = pickupSites(state, { x, y }).map(p => ({
        index: key(p), type: state.board[p.y][p.x], amount: state.amounts[p.y][p.x]
      }));
    }));
    const visited = new Uint8Array(size);
    const touches = new Uint8Array(size);
    const counts = { copper: 0, crystal: 0 };
    let best = state.stage.budget + 1;
    function walk(i, distance) {
      // Incremental reference counts handle rich seams adjacent to multiple tracks.
      for (const ore of pickups[i]) {
        if (touches[ore.index]++ === 0) counts[ore.type] += ore.amount;
      }
      if (distance && counts.copper >= state.order.copper && counts.crystal >= state.order.crystal) {
        best = Math.min(best, distance);
      } else if (distance + 1 < best) {
        visited[i] = 1;
        for (const j of neighbours[i]) {
          const cost = distance + costs[j];
          if (!visited[j] && cost < best) walk(j, cost);
        }
        visited[i] = 0;
      }
      for (const ore of pickups[i]) {
        if (--touches[ore.index] === 0) counts[ore.type] -= ore.amount;
      }
    }
    walk(key(start), 0);
    const length = best <= state.stage.budget ? best : null;
    cache.set(state.equipped, length);
    return length;
  }

  function placeRail(state, x, y) {
    if (state.phase !== 'plan') return fail('这趟已经回营');
    const p = { x,y };
    const prev = state.path[state.path.length - 2];
    if (prev && same(prev, p)) return removeRail(state);
    if (!inside(p) || !touching(state.path[state.path.length - 1], p)) return fail('只可铺在车头相邻的格子');
    const type = state.board[y][x];
    if (type === 'rock') return fail('这块是硬岩');
    if (isOre(type)) return fail('矿脉旁铺轨即可采矿');
    if (state.path.some(q => same(q, p))) return fail('轨道不能交叉');
    const cost = trackCost(state, p);
    if (usedRails(state) + cost > state.budget) {
      return fail(cost === 2 ? '碎岩需要 2 节轨道，剩余轨道不足' : '轨道已经用完');
    }
    state.path.push(p);
    return { ok: true };
  }

  function removeRail(state) {
    if (state.phase !== 'plan') return fail('这趟已经回营');
    if (state.path.length <= 1) return fail('已经回到起点');
    state.path.pop();
    return { ok: true };
  }


  function freshRound(seed, round, inventory, legacyTrip = false) {
    const map = makeMap(seed, round, legacyTrip);
    return {
      seed, round, legacyTrip, ...map, ...inventory,
      phase: 'plan', path: [{ ...start }], result: null,
      budget: map.stage.budget + inventory.upgrades + (inventory.equipped === 'long' ? 2 : 0)
    };
  }

  function newSeed() {
    if (window.crypto && window.crypto.getRandomValues) {
      return window.crypto.getRandomValues(new Uint32Array(1))[0];
    }
    return Math.floor(Math.random() * 4294967296);
  }

  function inventoryFrom(d) {
    if (!d || !Number.isInteger(d.upgrades) || d.upgrades < 0 || d.upgrades > upgradeCosts.length ||
        !d.wallet || !['copper','crystal','plans'].every(k => Number.isSafeInteger(d.wallet[k]) && d.wallet[k] >= 0) ||
        !Array.isArray(d.owned) || !d.owned.every(validCard) ||
        !(d.equipped === null || d.owned.includes(d.equipped))) return null;
    return { wallet: { ...d.wallet }, owned: [...new Set(d.owned)], equipped: d.equipped, upgrades: d.upgrades };
  }

  function parseSave(raw) {
    try { return JSON.parse(raw); } catch { return null; }
  }

  function surveyFrom(save) {
    const surveyTickets = save.surveyTickets ?? 1;
    if (!Number.isSafeInteger(surveyTickets) || surveyTickets < 0) return null;
    const surveyTargets = save.surveyTargets ?? [];
    if (!Array.isArray(surveyTargets) || !surveyTargets.every(n => Number.isSafeInteger(n) && n > 0)) return null;
    return { surveyTickets, surveyTargets: [...new Set(surveyTargets)] };
  }

  function surveyMap(map) {
    const { board, amounts, order, stage, rubble, relic } = map;
    return { board, amounts, order, stage, rubble, relic, oddity: map.oddity ?? null, jade: map.jade ?? null };
  }

  function emptyProgress(frontier = 1) {
    return { frontier, collection: [], bestRails: {}, gold: [], plannedEquipment: {}, ...surveyFrom({}) };
  }

  function progressFrom(d) {
    if (!Number.isSafeInteger(d.frontier) || d.frontier < d.round || !Array.isArray(d.collection)) return null;
    const ids = new Set((window.MineLevels.relics || []).map(r => r.id));
    const collection = [...new Set(d.collection.filter(id => ids.has(id)))];
    const bestRails = {};
    for (const [level, cost] of Object.entries(d.bestRails || {})) {
      const n = Number(level);
      if (Number.isInteger(n) && n >= 1 && n <= 10 && Number.isSafeInteger(cost) && cost > 0) bestRails[n] = cost;
    }
    const gold = Array.isArray(d.gold) ? [...new Set(d.gold.filter(n => Number.isInteger(n) && n >= 1 && n <= 10))] : [];
    const survey = surveyFrom(d);
    if (!survey) return null;
    const plannedEquipment = {};
    for (const [level,id] of Object.entries(d.plannedEquipment || {})) {
      const n = Number(level);
      if (Number.isSafeInteger(n) && n > 0 && (id === null || d.owned.includes(id))) plannedEquipment[n] = id;
    }
    return { collection, frontier: d.frontier, bestRails, gold, plannedEquipment, ...survey };
  }

  function recordClear(state) {
    if (state.round > window.MineLevels.stages.length) return;
    const rails = usedRails(state);
    state.bestRails[state.round] = Math.min(state.bestRails[state.round] || Infinity, rails);
    if (rails === optimalLength(state) && !state.gold.includes(state.round)) state.gold.push(state.round);
  }

  function migrateLegacy(raw) {
    const d = parseSave(raw);
    if (!d || d.version !== 1 || !Number.isInteger(d.seed)) return null;
    const inventory = inventoryFrom(d);
    return inventory ? freshRound(d.seed >>> 0, 1, { ...inventory, ...emptyProgress() }) : null;
  }

  function restore(raw, version = 3) {
    const d = parseSave(raw);
    if (!d || d.version !== version || !Number.isInteger(d.seed) || !Number.isSafeInteger(d.round) ||
        d.round < 1 || !['plan','done'].includes(d.phase) || !Array.isArray(d.path) || !d.path.length) return null;
    const inventory = inventoryFrom(d);
    if (!inventory) return null;
    const progress = version === 2 ? emptyProgress(d.round) : progressFrom(d);
    if (!progress) return null;
    const legacyTrip = version === 2 ? d.path.length > 1 : d.legacyTrip === true;
    const state = freshRound(d.seed >>> 0, d.round, { ...inventory, ...progress }, legacyTrip);
    if (d.path.length > 1 + state.budget || !d.path[0] || !same(d.path[0], start) ||
        !d.path.every(p => p && inside(p) && state.board[p.y][p.x] === 'ground') ||
        new Set(d.path.map(key)).size !== d.path.length || !d.path.slice(1).every((p, i) => touching(p, d.path[i]))) return null;
    state.path = d.path.map(p => ({ x: p.x, y: p.y }));
    if (usedRails(state) > state.budget) return null;
    if (d.phase === 'done') {
      if (state.path.length < 2) return null;
      const goods = computeReturn(state);
      const met = goods.copper >= state.order.copper && goods.crystal >= state.order.crystal;
      const firstClear = met && (version === 2 || d.firstClear === true);
      if (firstClear && (!d.reward || !validCard(d.reward.id) || typeof d.reward.isNew !== 'boolean')) return null;
      const dig = version === 2 ? 'none' : d.dig;
      if (!['none','pending','found','miss'].includes(dig) || (dig !== 'none' && goods.relicStep < 0)) return null;
      if (dig === 'pending' && state.collection.includes(state.relic.id)) return null;
      if (dig === 'found' && !state.collection.includes(state.relic.id)) return null;
      const card = firstClear ? { id: d.reward.id, isNew: d.reward.isNew } : null;
      state.phase = 'done';
      state.result = { ...goods, met, firstClear, card, dig, ticketEarned: d.ticketEarned === true };
      if (version === 2 && met) {
        state.frontier = state.round + 1;
        recordClear(state);
      }
    }
    return state;
  }

  function create(options = {}) {
    let storage = null;
    let snapshot = null;
    let stageSnapshot = null;
    let legacy = null;
    try {
      storage = 'storage' in options ? options.storage : window.localStorage;
      if (storage) {
        snapshot = storage.getItem(storageKey);
        stageSnapshot = storage.getItem(stageStorageKey);
        legacy = storage.getItem(oldStorageKey);
      }
    } catch { storage = null; }
    let state = restore(snapshot);
    const needsNewSave = !state;
    if (!state) {
      state = restore(stageSnapshot, 2) || migrateLegacy(legacy);
      if (!state) {
        state = freshRound(Number.isInteger(options.seed) ? options.seed >>> 0 : newSeed(), 1, {
          wallet: { copper: 0, crystal: 0, plans: 0 }, owned: [], equipped: null, upgrades: 0, ...emptyProgress()
        });
      }
    }

    function save() {
      if (!storage) return;
      const { seed, round, phase, path, wallet, owned, equipped, upgrades, result } = state;
      const { frontier, collection, bestRails, gold, legacyTrip } = state;
      const raw = JSON.stringify({ version: 3, seed, round, phase, path, wallet, owned, equipped, upgrades,
        frontier, collection, bestRails, gold, legacyTrip, surveyTickets: state.surveyTickets,
        surveyTargets: state.surveyTargets, plannedEquipment: state.plannedEquipment, ticketEarned: result?.ticketEarned,
        reward: result && result.card, firstClear: result && result.firstClear, dig: result && result.dig });
      try {
        storage.setItem(storageKey, raw);
        snapshot = raw;
      } catch { storage = null; }
    }

    function mutate(operation) {
      if (storage) {
        try {
          const raw = storage.getItem(storageKey);
          if (raw && raw !== snapshot) {
            const newer = restore(raw);
            if (newer) {
              state = newer;
              snapshot = raw;
              return fail('另一窗口更新了存档，请重新操作');
            }
          }
        } catch { storage = null; }
      }
      const res = operation();
      if (res.ok) save();
      return res;
    }

    function dispatch() {
      if (state.phase !== 'plan') return fail('这趟已经结算');
      if (state.path.length <= 1) return fail('至少铺一节轨道再发车');
      const goods = computeReturn(state);
      const met = goods.copper >= state.order.copper && goods.crystal >= state.order.crystal;
      state.wallet.copper += goods.copper;
      state.wallet.crystal += goods.crystal;
      let card = null;
      const firstClear = met && state.round === state.frontier;
      const ticketEarned = firstClear && state.round % 3 === 0;
      if (ticketEarned) state.surveyTickets++;
      if (met) recordClear(state);
      if (firstClear) {
        state.frontier++;
        const draw = randomFor(state.seed ^ Math.imul(state.round, 0x85ebca6b) ^ 0xc2b2ae35);
        const id = cards[Math.floor(draw() * cards.length)].id;
        const isNew = !state.owned.includes(id);
        if (isNew) state.owned.push(id);
        else state.wallet.plans++;
        card = { id, isNew };
      }
      state.phase = 'done';
      const dig = goods.relicStep >= 0 && !state.collection.includes(state.relic.id) ? 'pending' : 'none';
      state.result = { ...goods, met, firstClear, card, dig, ticketEarned };
      return { ok: true, result: state.result };
    }

    function resolveDig(success) {
      if (typeof success !== 'boolean') return fail('请完成发掘或跳过');
      if (state.phase !== 'done') return fail('请先发车');
      const result = state.result;
      const outcome = success ? 'found' : 'miss';
      if (result.dig === outcome) return { ok: true, result };
      if (result.dig !== 'pending') return fail('这次发掘已经结束');
      if (success && !state.collection.includes(state.relic.id)) state.collection.push(state.relic.id);
      result.dig = outcome;
      return { ok: true, result };
    }

    function visit(level) {
      if (!Number.isSafeInteger(level) || level < 1 || level > state.frontier) return fail('这关尚未解锁');
      if (state.phase === 'plan' && state.path.length > 1) return fail('请先收回轨道或发车');
      if (state.result && state.result.dig === 'pending') return fail('请先完成藏品发掘，或跳过');
      const { wallet, owned, upgrades, frontier, collection, bestRails, gold, surveyTickets, surveyTargets, plannedEquipment } = state;
      const equipped = Object.prototype.hasOwnProperty.call(plannedEquipment, level) ? plannedEquipment[level] : state.equipped;
      delete plannedEquipment[level];
      state = freshRound(state.seed, level, { wallet, owned, equipped, upgrades, frontier, collection, bestRails, gold,
        surveyTickets, surveyTargets, plannedEquipment });
      return { ok: true };
    }

    function next() {
      if (state.phase !== 'done') return fail('先发车回营');
      return visit(state.frontier);
    }

    function scout(offset) {
      if (offset !== 1 && offset !== 2) return { ...fail('只可预看接下来的两关'), locked: false };
      const number = state.round + offset;
      if (offset === 2 && number > state.frontier && !state.surveyTargets.includes(number)) {
        return { ...fail('需要一张勘探券'), locked: true, number };
      }
      return { ok: true, locked: false, number, map: surveyMap(makeMap(state.seed, number, false)) };
    }

    function revealScout() {
      const target = scout(2);
      if (!target.locked) return target;
      if (state.surveyTickets <= 0) return { ...target, reason: '勘探券不足' };
      state.surveyTickets--;
      state.surveyTargets.push(target.number);
      return scout(2);
    }

    function prepareEquip(id, level = state.round + 1) {
      const target = scout(level - state.round);
      if (!target.ok) return target;
      if (id !== null && !state.owned.includes(id)) return fail('尚未获得这件装备');
      state.plannedEquipment[level] = id;
      return { ok: true };
    }

    function equip(id) {
      if (state.phase !== 'plan' || state.path.length !== 1) return fail('请在铺轨前更换装备');
      if (id !== null && !state.owned.includes(id)) return fail('尚未获得这件装备');
      state.equipped = id;
      state.budget = state.stage.budget + state.upgrades + (id === 'long' ? 2 : 0);
      return { ok: true };
    }

    function upgrade() {
      if (state.phase !== 'plan' || state.path.length !== 1) return fail('请在铺轨前升级');
      const cost = upgradeCost(state);
      if (!cost) return fail('永久轨道已经升满');
      if (state.wallet.copper < cost.copper || state.wallet.crystal < cost.crystal) return fail('仓库材料不足');
      state.wallet.copper -= cost.copper;
      state.wallet.crystal -= cost.crystal;
      state.upgrades++;
      state.budget++;
      return { ok: true };
    }

    function redeem(id) {
      if (!validCard(id)) return fail('未知装备');
      if (state.owned.includes(id)) return fail('已经收藏这件装备');
      if (state.wallet.plans < redeemCost) return fail('兑换需要 3 张图纸');
      state.wallet.plans -= redeemCost;
      state.owned.push(id);
      return { ok: true };
    }

    if (needsNewSave) save();
    return {
      get state() { return state; },
      get storageOK() { return Boolean(storage); },
      preview: () => computeReturn(state), par: () => optimalLength(state),
      used: () => usedRails(state), trackCost: (x,y) => trackCost(state, { x,y }),
      resolveDig: success => mutate(() => resolveDig(success)), visit: level => mutate(() => visit(level)),
      move: (x,y) => mutate(() => placeRail(state,x,y)), undo: () => mutate(() => removeRail(state)), dispatch: () => mutate(dispatch),
      scout, revealScout: () => mutate(revealScout), prepareEquip: (id, level) => mutate(() => prepareEquip(id, level)),
      next: () => mutate(next), equip: id => mutate(() => equip(id)), upgrade: () => mutate(upgrade),
      redeem: id => mutate(() => redeem(id))
    };
  }

  const rules = Object.freeze({
    decodeStage, placeRail, removeRail, pickupSites, computeReturn, optimalLength, usedRails, trackCost, randomFor, newSeed, surveyMap, surveyFrom
  });
  window.MineGame = { create, cards, redeemCost, upgradeCost, width, height, rules };
})();

<script>
/* 三站快运 · 独立的限时运单与货款 */
(() => {
  'use strict';
  const rules = window.MineGame.rules;
  const key = 'huicheng-minecart.express.v1';
  const durations = [24, 21, 18];
  const jadeOffer = 48;
  const jadeCuts = [
    { value: 20, weight: 40 }, { value: 40, weight: 25 },
    { value: 80, weight: 25 }, { value: 100, weight: 10 }
  ];
  const paints = [
    { id: 'standard', name: '原装矿车', price: 0, color: '#b6885e' },
    { id: 'celadon', name: '圆舱探矿车', price: 36, color: '#78c7aa' },
    { id: 'cinnabar', name: '吊臂工程车', price: 80, color: '#ce6553' },
    { id: 'inkjade', name: '穿山甲钻车', price: null, color: '#368e79',
      milestone: 'jade', target: 1, requirement: '出售或切开第一块玉石' },
    { id: 'nightmail', name: '蒸汽邮车', price: null, color: '#7189d6',
      milestone: 'delivery', target: 5, requirement: '累计完成 5 站快运交货' },
    { id: 'gilt', name: '金龙巡游车', price: null, color: '#d9aa4f',
      milestone: 'grades', target: 4, requirement: '亲自切出全部四种成色' }
  ];
  const fail = reason => ({ ok: false, reason });
  const integer = value => Number.isSafeInteger(value) && value >= 0;
  const paintById = id => paints.find(item => item.id === id);
  const tiers = () => window.ExpressMaps.tiers;

  function emptyAlbum() {
    return { deliveries: 0, sold: 0, cuts: { 20: 0, 40: 0, 80: 0, 100: 0 } };
  }

  function validateAlbum(album) {
    return album && integer(album.deliveries) && integer(album.sold) && album.cuts &&
      jadeCuts.every(({value}) => integer(album.cuts[value]));
  }

  function albumProgress(album) {
    const cutCounts = jadeCuts.map(({value}) => album.cuts[value]);
    return {
      delivery: album.deliveries,
      jade: album.sold + cutCounts.reduce((sum, count) => sum + count, 0),
      grades: cutCounts.filter(count => count > 0).length
    };
  }

  function unlockModels(state) {
    const progress = albumProgress(state.album);
    for (const model of paints) {
      if (model.milestone && progress[model.milestone] >= model.target && !state.paints.includes(model.id)) {
        state.paints.push(model.id);
      }
    }
  }

  function rebarStop(run, seed) {
    return run === 1 ? 1 : 1 + Math.floor(rules.randomFor(seed ^ 0x1d68b15f)() * 2);
  }

  function jadeStop(run, seed) {
    if (run === 1) return 1;
    const roll = rules.randomFor(seed ^ 0x0ae4d249)();
    if (roll < 2 / 3) return 0;
    return roll < 5 / 6 ? 1 : 2;
  }

  // The sealed value is determined by the run seed, independently of the route
  // and the player's choice. Reopening the game therefore reveals the same stone.
  function cutValue(seed) {
    let roll = Math.floor(rules.randomFor(seed ^ 0x7e36d0a1)() * 100);
    for (const grade of jadeCuts) {
      if (roll < grade.weight) return grade.value;
      roll -= grade.weight;
    }
  }

  function freshRun(seed, run, previous, profile) {
    const random = rules.randomFor(seed ^ Math.imul(run, 0x9e3779b1));
    let runSeed = Math.floor(random() * 4294967296);
    if (previous && previous.runSeed === runSeed) runSeed = (runSeed + 1) >>> 0;
    const count = tiers()[0].length;
    let firstIndex;
    if (previous && count > 1) {
      firstIndex = Math.floor(random() * (count - 1));
      if (firstIndex >= previous.firstIndex) firstIndex++;
    } else {
      firstIndex = Math.floor(random() * count);
    }
    return loadStop({ seed, run, runSeed, lastRunSeed: previous ? previous.runSeed : null,
      firstIndex, rebarStation: rebarStop(run, runSeed), jadeStation: jadeStop(run, runSeed),
      ...profile, surveyTargets: [], pot: 0, settled: 0, lostFare: 0 }, 1, null);
  }

  function stopTemplate(trip, station) {
    const tier = tiers()[station - 1];
    const random = rules.randomFor(trip.runSeed ^ Math.imul(station, 0x85ebca6b));
    const index = station === 1 ? trip.firstIndex : Math.floor(random() * tier.length);
    return { source: tier[index], flip: random() < 0.5 };
  }

  // Only veins accessible on a fulfilled order within the standard rail budget
  // can hold a discovery. Count their frequency to select an easy first find.
  function surveyVeins(stop) {
    const cart = { ...stop, path: [{ x: 0, y: 3 }], budget: stop.stage.budget };
    const eligible = new Map();
    let fullOrders = 0;
    const dirs = [[1,0],[0,-1],[-1,0],[0,1]];
    function search() {
      const goods = rules.computeReturn(cart);
      if (cart.path.length > 1 && goods.copper >= cart.order.copper && goods.crystal >= cart.order.crystal) {
        fullOrders++;
        for (const step of goods.steps) {
          for (const vein of step.ores) {
            const id = vein.y * 8 + vein.x;
            if (!eligible.has(id)) eligible.set(id, { x: vein.x, y: vein.y, type: vein.type, count: 0 });
            eligible.get(id).count++;
          }
        }
      }
      if (rules.usedRails(cart) >= cart.budget) return;
      const head = cart.path[cart.path.length - 1];
      for (const [dx,dy] of dirs) {
        const x = head.x + dx, y = head.y + dy;
        if (cart.path.some(p => p.x === x && p.y === y)) continue;
        if (rules.placeRail(cart, x, y).ok) {
          search();
          rules.removeRail(cart);
        }
      }
    }
    search();
    return { veins: [...eligible.values()], fullOrders };
  }

  function chooseSeam(stop, survey, kind) {
    const steel = kind === 'rebar';
    const veins = steel ? survey.veins.filter(v => v.type === 'copper') : survey.veins;
    if (!veins.length) return null;
    const optional = veins.filter(v => v.count < survey.fullOrders);
    let choices = optional.length ? optional : veins;
    if (!steel && stop.run === 1) {
      const peak = Math.max(...veins.map(v => v.count));
      choices = veins.filter(v => v.count === peak);
    }
    const salt = steel ? 0x1859aa71 : 0x3b6a1a57;
    const random = rules.randomFor(stop.runSeed ^ Math.imul(stop.station, salt));
    const { x,y } = choices[Math.floor(random() * choices.length)];
    return { x,y,kind };
  }

  function loadStop(trip, station, bonus, rebarRail = false) {
    const { source, flip } = stopTemplate(trip, station);
    const rows = flip ? source.rows.slice().reverse() : source.rows;
    const map = rules.decodeStage(source, rows, false);
    map.rubble = (source.rubble || []).map(p => ({ x: p.x, y: flip ? rows.length - 1 - p.y : p.y }));
    const stop = {
      ...trip, ...map, station, bonus, rebarRail, oddity: null, jade: null,
      budget: source.budget + (bonus === 'rail' ? 1 : 0) + (rebarRail ? 1 : 0),
      equipped: null, collection: [], phase: 'plan', path: [{ x: 0, y: 3 }], result: null,
      started: false, paused: false, leftMs: durations[station - 1] * 1000, deadline: null
    };
    if (trip.rebarStation === station || trip.jadeStation === station) {
      const survey = surveyVeins(stop);
      if (trip.rebarStation === station) stop.oddity = chooseSeam(stop, survey, 'rebar');
      if (trip.jadeStation === station) stop.jade = chooseSeam(stop, survey, 'jade');
    }
    return stop;
  }

  function preview(state) {
    const goods = rules.computeReturn(state);
    const found = seam => Boolean(seam && state.path.length > 1 && goods.steps.some(step =>
      step.ores.some(vein => vein.x === seam.x && vein.y === seam.y)));
    return { ...goods, foundRebar: found(state.oddity), foundJade: found(state.jade) };
  }

  function delivery(state, timeout) {
    const goods = preview(state);
    const met = state.path.length > 1 && goods.copper >= state.order.copper && goods.crystal >= state.order.crystal;
    const fare = met ? (goods.copper * 2 + goods.crystal * 4) * (state.bonus === 'double' ? 2 : 1) : 0;
    const jade = met && goods.foundJade ? 'pending' : 'none';
    return { ...goods, met, fare, timeout, jade, jadeValue: 0, ticketEarned: false };
  }

  function restore(raw) {
    let d;
    try { d = JSON.parse(raw); } catch { return null; }
    if (!d || ![1,2,3,4].includes(d.version) || !integer(d.seed) || !integer(d.run) || !integer(d.runSeed) ||
        !integer(d.firstIndex) || d.firstIndex >= tiers()[0].length ||
        ![1,2,3].includes(d.station) || !['plan','offer','lost','banked'].includes(d.phase) ||
        ![null,'double','rail'].includes(d.bonus) || !Array.isArray(d.path) ||
        ![d.coins,d.best,d.pot,d.settled,d.lostFare].every(integer) ||
        !Array.isArray(d.paints) || !d.paints.every(paintById) || !d.paints.includes(d.paint) ||
        !Number.isFinite(d.leftMs) || d.leftMs < 0 || d.leftMs > durations[d.station - 1] * 1000) return null;
    // Old settled trips keep their original rewards. An untouched first stop can
    // reveal a seam, since the player has not planned or collected anything yet.
    const untouched = d.station === 1 && d.phase === 'plan' && !d.started && d.path.length === 1;
    const rebarStation = d.version >= 2 ? d.rebarStation : (untouched ? rebarStop(d.run, d.runSeed) : 0);
    const jadeStation = d.version >= 3 ? d.jadeStation : (untouched ? jadeStop(d.run, d.runSeed) : 0);
    if (![0,1,2].includes(rebarStation) || ![0,1,2].includes(jadeStation)) return null;
    const rebarRail = d.version >= 2 && d.rebarRail === true;
    if (rebarRail && (!rebarStation || d.station !== rebarStation + 1)) return null;
    if (d.version >= 4 && !validateAlbum(d.album)) return null;
    const album = d.version >= 4 ? d.album : emptyAlbum();
    const survey = rules.surveyFrom(d);
    if (!survey) return null;
    const trip = {
      ...survey, album, rebarStation, jadeStation, seed: d.seed, run: d.run, runSeed: d.runSeed, lastRunSeed: d.lastRunSeed, firstIndex: d.firstIndex,
      coins: d.coins, best: d.best, pot: d.pot, settled: d.settled, lostFare: d.lostFare,
      paints: [...new Set(d.paints)], paint: d.paint
    };
    const state = loadStop(trip, d.station, d.bonus, rebarRail);
    if (d.version >= 2 && d.station === rebarStation) {
      const seam = d.oddity;
      if (!seam || seam.kind !== 'rebar' || !Number.isInteger(seam.x) || !Number.isInteger(seam.y) ||
          state.board[seam.y]?.[seam.x] !== 'copper') return null;
      state.oddity = { x: seam.x, y: seam.y, kind: 'rebar' };
    }
    if (d.version >= 3 && d.station === jadeStation) {
      const seam = d.jade;
      if (!seam || seam.kind !== 'jade' || !Number.isInteger(seam.x) || !Number.isInteger(seam.y) ||
          !['copper','crystal'].includes(state.board[seam.y]?.[seam.x])) return null;
      state.jade = { x: seam.x, y: seam.y, kind: 'jade' };
    }
    if (!d.path.length || d.path[0]?.x !== 0 || d.path[0]?.y !== 3 || d.path.length > state.budget + 1) return null;
    for (const p of d.path.slice(1)) {
      const before = state.path.length;
      if (!p || !rules.placeRail(state,p.x,p.y).ok || state.path.length !== before + 1) return null;
    }
    state.started = d.started === true;
    state.paused = d.paused === true;
    state.leftMs = d.leftMs;
    state.deadline = d.deadline;
    if (state.started && !state.paused && d.phase === 'plan' && !Number.isFinite(state.deadline)) return null;
    state.phase = d.phase;
    if (state.phase !== 'plan') {
      state.result = delivery(state, d.timeout === true);
      state.result.ticketEarned = d.ticketEarned === true;
      if (d.version >= 3) {
        if (state.result.jade === 'pending') {
          if (!['pending','sold','cut'].includes(d.jadeStatus) || (state.phase === 'banked' && d.jadeStatus === 'pending')) return null;
          const value = d.jadeStatus === 'cut' ? cutValue(state.runSeed) : d.jadeStatus === 'sold' ? jadeOffer : 0;
          if (d.jadeValue !== value) return null;
          state.result.jade = d.jadeStatus;
          state.result.jadeValue = value;
        } else if (d.jadeStatus !== 'none' || d.jadeValue !== 0) return null;
      }
    }
    if (d.version < 4) {
      // The surviving manifest proves each earlier stop in this run was delivered.
      // Older trips have no detailed history, so import only verifiable events.
      album.deliveries = state.station - 1 + (state.result?.met ? 1 : 0);
      if (state.result?.jade === 'sold') album.sold = 1;
      if (state.result?.jade === 'cut') album.cuts[state.result.jadeValue] = 1;
    }
    unlockModels(state);
    return state;
  }

  function create(options = {}) {
    const now = typeof options.now === 'function' ? options.now : Date.now;
    let storage = null, snapshot = null;
    try {
      storage = 'storage' in options ? options.storage : window.localStorage;
      snapshot = storage ? storage.getItem(key) : null;
    } catch { storage = null; }
    let state = restore(snapshot);
    const isNew = !state;
    if (!state) {
      const seed = Number.isInteger(options.seed) ? options.seed >>> 0 : rules.newSeed();
      state = freshRun(seed, 1, null, { coins: 0, best: 0, paints: ['standard'], paint: 'standard', album: emptyAlbum(), surveyTickets: 1 });
    }

    function remaining() {
      if (!state.started || state.paused || state.phase !== 'plan') return state.leftMs;
      return Math.max(0, Math.min(state.leftMs, state.deadline - now()));
    }

    function save() {
      if (!storage) return;
      const { seed, run, runSeed, lastRunSeed, firstIndex, station, phase, path, coins, best,
        pot, settled, lostFare, paint, paints: ownedPaints, bonus, started, paused, deadline, result } = state;
      const { rebarStation, rebarRail, oddity, jadeStation, jade } = state;
      const raw = JSON.stringify({ version: 4, album: state.album, surveyTickets: state.surveyTickets,
        surveyTargets: state.surveyTargets, ticketEarned: result?.ticketEarned,
        jadeStation,jade,jadeStatus: result?.jade,jadeValue: result?.jadeValue,
        rebarStation,rebarRail,oddity,seed,run,runSeed,lastRunSeed,firstIndex,station,phase,path,
        coins,best,pot,settled,lostFare,paint,paints:ownedPaints,bonus,started,paused,deadline,
        leftMs: remaining(), timeout: Boolean(result && result.timeout) });
      try {
        storage.setItem(key, raw);
        snapshot = raw;
      } catch { storage = null; }
    }

    function sync() {
      if (!storage) return false;
      try {
        const raw = storage.getItem(key);
        if (raw === snapshot || !raw) return false;
        const updated = restore(raw);
        if (!updated) return false;
        state = updated;
        snapshot = raw;
        return true;
      } catch { storage = null; return false; }
    }

    function bankPot() {
      state.settled = state.pot;
      state.coins += state.pot;
      state.best = Math.max(state.best, state.pot);
      state.pot = 0;
      state.phase = 'banked';
    }

    function dispatch(timeout) {
      if (state.phase !== 'plan') return fail('本站已结算');
      if (!timeout && state.paused) return fail('请先继续快运');
      if (!timeout && state.path.length === 1) return fail('至少铺一节轨道再发车');
      state.leftMs = remaining();
      state.deadline = null;
      state.paused = false;
      state.result = delivery(state, timeout);
      if (!state.result.met) {
        state.lostFare = state.pot;
        state.pot = 0;
        state.phase = 'lost';
      } else {
        state.album.deliveries++;
        state.result.ticketEarned = state.album.deliveries % 3 === 0;
        if (state.result.ticketEarned) state.surveyTickets++;
        unlockModels(state);
        state.pot += state.result.fare;
        if (state.station === 3) bankPot();
        else state.phase = 'offer';
      }
      return { ok: true, result: state.result, expired: timeout };
    }

    function due() {
      return state.phase === 'plan' && state.started && !state.paused && remaining() <= 0;
    }

    function act(operation, acceptExpiry = false) {
      if (sync()) return fail('另一窗口更新了快运进度，请重试');
      // Expiration wins ties with a last-second placement, pause or manual dispatch.
      if (due()) {
        const settled = dispatch(true);
        save();
        return acceptExpiry ? settled : { ...settled, ok: false, reason: '本站时间已到，矿车已发车' };
      }
      const answer = operation();
      if (answer.ok) save();
      return answer;
    }

    function move(x,y) {
      if (state.paused) return fail('请先继续快运');
      const res = rules.placeRail(state,x,y);
      if (res.ok && !state.started) {
        state.started = true;
        state.deadline = now() + state.leftMs;
      }
      return res;
    }

    function pause() {
      if (state.phase === 'plan' && !state.paused) {
        state.leftMs = remaining();
        state.paused = true;
        state.deadline = null;
      }
      return { ok: true };
    }

    function resume() {
      if (state.phase === 'plan' && state.paused) {
        state.paused = false;
        if (state.started) state.deadline = now() + state.leftMs;
      }
      return { ok: true };
    }

    function scout(offset) {
      if (offset !== 1 && offset !== 2) return { ...fail('只可预看接下来的两站'), locked: false };
      const number = state.station + offset;
      if (number > 3 || state.phase === 'banked' || state.phase === 'lost') {
        return { ...fail('本趟没有这座后续站点'), locked: false, number };
      }
      if (offset === 2 && !state.surveyTargets.includes(number)) {
        return { ...fail('需要一张勘探券'), locked: true, number };
      }
      return { ok: true, locked: false, number, map: rules.surveyMap(loadStop(state, number, null)) };
    }

    function revealScout() {
      const target = scout(2);
      if (!target.locked) return target;
      if (state.surveyTickets <= 0) return { ...target, reason: '勘探券不足' };
      state.surveyTickets--;
      state.surveyTargets.push(target.number);
      return scout(2);
    }

    function nextStop() {
      if (state.station === 3) return null;
      const station = state.station + 1;
      const { source } = stopTemplate(state, station);
      return { name: source.name, order: { ...source.order }, budget: source.budget, seconds: durations[station - 1] };
    }

    function resolveJade(choice) {
      if (!['sell','cut'].includes(choice)) return fail('请选择卖给商家或切开');
      const result = state.result;
      if (!result || state.phase !== 'offer') return fail('这里没有待处理的原石');
      const outcome = choice === 'sell' ? 'sold' : 'cut';
      if (result.jade === outcome) return { ok: true, result, amount: result.jadeValue };
      if (result.jade !== 'pending') return fail('这里没有待处理的原石');
      const amount = choice === 'sell' ? jadeOffer : cutValue(state.runSeed);
      result.jade = outcome;
      result.jadeValue = amount;
      state.pot += amount;
      if (choice === 'sell') state.album.sold++;
      else state.album.cuts[amount]++;
      unlockModels(state);
      return { ok: true, result, amount };
    }

    function advance(bonus) {
      if (state.phase !== 'offer') return fail('先完成本站订单');
      if (state.result.jade === 'pending') return fail('先决定怎样处理原石');
      if (!['double','rail'].includes(bonus)) return fail('请选择加价券或备用轨');
      state = loadStop(state, state.station + 1, bonus, state.result.foundRebar);
      return { ok: true };
    }

    function bank() {
      if (state.phase !== 'offer') return fail('这趟货款已处理');
      if (state.result.jade === 'pending') return fail('先决定怎样处理原石');
      bankPot();
      return { ok: true, amount: state.settled };
    }

    function restart() {
      if (!['lost','banked'].includes(state.phase)) return fail('先结算这趟快运');
      const { coins, best, paints: ownedPaints, paint, album, surveyTickets } = state;
      state = freshRun(state.seed, state.run + 1, state, { coins, best, paints: ownedPaints, paint, album, surveyTickets });
      return { ok: true };
    }

    function equipPaint(id) {
      if (!state.paints.includes(id)) return fail('这款车型尚未入库');
      state.paint = id;
      return { ok: true };
    }

    function buyPaint(id) {
      const item = paintById(id);
      if (!item) return fail('未知车型');
      if (state.paints.includes(id)) return equipPaint(id);
      if (item.milestone) return fail('解锁车型需要' + item.requirement);
      if (state.coins < item.price) return fail('已存货款不足');
      state.coins -= item.price;
      state.paints.push(id);
      return equipPaint(id);
    }

    function tick() {
      if (!due()) return { ok: true, expired: false };
      return act(() => ({ ok: true, expired: false }), true);
    }

    if (isNew) save();
    return {
      get state() { return state; },
      get storageOK() { return Boolean(storage); },
      remaining, tick, nextStop, scout, revealScout: () => act(revealScout), preview: () => preview(state), par: () => rules.optimalLength(state),
      used: () => rules.usedRails(state), trackCost: (x,y) => rules.trackCost(state,{x,y}),
      move: (x,y) => act(() => move(x,y)),
      undo: () => act(() => state.paused ? fail('请先继续快运') : rules.removeRail(state)),
      dispatch: () => act(() => dispatch(false), true), pause: () => act(pause), resume: () => act(resume),
      resolveJade: choice => act(() => resolveJade(choice)),
      advance: bonus => act(() => advance(bonus)), bank: () => act(bank), restart: () => act(restart),
      buyPaint: id => act(() => buyPaint(id)), equipPaint: id => act(() => equipPaint(id))
    };
  }

  window.MineExpress = { create, paints, durations, jadeOffer, jadeCuts, albumProgress, storageKey: key };
})();

</script>
<script>
/* Explanations derived from the same pickup, rail cost and order rules as dispatch. */
(() => {
  'use strict';
  const rules=window.MineGame.rules;
  const names={copper:'铜矿',crystal:'蓝晶'};
  const shortNames={copper:'铜',crystal:'晶'};
  const grades=['','小矿','矿簇','富矿'];
  const sameCell=(p,x,y)=>p && p.x===x && p.y===y;

  function inspect(state,x,y){
    const type=state.board[y]?.[x];
    if(state.phase!=='plan' || !names[type])return null;
    const amount=state.amounts[y][x], grade=grades[amount];
    const approaches=[];
    for(let py=y-1;py<=y+1;py++){
      for(let px=x-1;px<=x+1;px++){
        if(state.board[py]?.[px]!=='ground')continue;
        const tile={x:px,y:py};
        if(rules.pickupSites(state,tile).some(ore=>sameCell(ore,x,y)))approaches.push(tile);
      }
    }
    let hint='沿标记格铺轨可收';
    if(approaches.some(tile=>tile.x!==x && tile.y!==y)){
      hint=type==='copper'?'线圈可从斜角收铜':'透镜可从斜角收晶';
    }
    if(!approaches.length)hint='周围没有可采位置';
    const extras=[];
    if(sameCell(state.jade,x,y))extras.push('原石');
    if(sameCell(state.oddity,x,y))extras.push('螺纹钢');
    const find=extras.length?'，夹有'+extras.join('和'):'';
    const note=names[type]+' · '+grade+' '+amount+' 份'+find+'。'+hint+'。';
    return {x,y,type,amount,grade,approaches,note};
  }

  // Return order changes when the cart moves; coordinate identity is stable.
  function added(previous,next){
    if(!previous || !next)return [];
    const id=ore=>ore.y*window.MineGame.width+ore.x;
    const covered=new Set(previous.steps.flatMap(step=>step.ores.map(id)));
    return next.steps.flatMap(step=>step.ores.filter(ore=>!covered.has(id(ore))));
  }

  function shortage(order,counts){
    const missing=[];
    for(const key of ['copper','crystal']){
      const n=order[key]-(counts[key]||0);
      if(n>0)missing.push(shortNames[key]+' '+n);
    }
    return missing.length?'还缺'+missing.join('、'):'';
  }

  function lastStepHint(state){
    if(!state.result || state.result.met || state.phase==='plan')return '';
    const head=state.path[state.path.length-1];
    const directions=[[1,0,'右'],[-1,0,'左'],[0,1,'下'],[0,-1,'上']];
    let best=null;
    for(const [dx,dy,direction] of directions){
      const x=head.x+dx,y=head.y+dy;
      // A move to the previous cell retracts track. Only test a new rail.
      if(state.board[y]?.[x]!=='ground' || state.path.some(p=>sameCell(p,x,y)))continue;
      const trial={...state,phase:'plan',path:state.path.slice()};
      if(!rules.placeRail(trial,x,y).ok)continue;
      if(shortage(state.order,rules.computeReturn(trial)))continue;
      const cost=rules.trackCost(state,{x,y});
      if(!best || cost<best.cost)best={direction,cost};
    }
    return best?'发车前往'+best.direction+'再铺一格，用 '+best.cost+' 节轨就能交齐。':'';
  }

  window.MineFeedback={inspect,added,shortage,lastStepHint,pulseMs:780};
})();

</script>
<script>
/* Original canvas pixel artwork for the return railway. */
(() => {
  "use strict";
  const TILE = 40, COLS = 8, ROWS = 7;
  const W = COLS * TILE, H = ROWS * TILE;
  const groundPalettes = [
    ["#202a32","#202831","#222c34","#212a32"],
    ["#2a2731","#292631","#2b2934","#292832"],
    ["#212638","#212439","#24283c","#222638"]
  ];
  const rockPalettes = [
    ["#454c59","#4b505e","#414a55","#444d5a"],
    ["#514955","#564c57","#4a454f","#514954"],
    ["#484a64","#4c4e68","#44495f","#494b65"]
  ];

  function box(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
  }
  // Integer scanlines keep every diagonal edge crisp at mobile pixel scales.
  function face(ctx, points, color) {
    const lower = Math.ceil(Math.min(...points.map(p => p[1])));
    const upper = Math.ceil(Math.max(...points.map(p => p[1])));
    ctx.fillStyle = color;
    for (let y = lower; y < upper; y++) {
      const scan = y + 0.5;
      const cuts = [];
      for (let i = 0; i < points.length; i++) {
        const a = points[i], b = points[(i + 1) % points.length];
        if ((a[1] > scan) !== (b[1] > scan)) {
          cuts.push(a[0] + (b[0] - a[0]) * (scan - a[1]) / (b[1] - a[1]));
        }
      }
      cuts.sort((a, b) => a - b);
      for (let i = 0; i < cuts.length; i += 2) {
        const l = Math.round(cuts[i]), r = Math.round(cuts[i + 1]);
        if (r > l) ctx.fillRect(l, y, r - l, 1);
      }
    }
  }

  function seedAt(x, y, salt = 0) {
    let n = Math.imul(x + 47, 73856093) ^ Math.imul(y + 179, 19349663) ^ Math.imul(salt + 5, 83492791);
    n ^= n >>> 15;
    return (Math.imul(n, 2246822519) >>> 0);
  }

  function floor(ctx, x, y, zone) {
    const bx = x * TILE, by = y * TILE, seed = seedAt(x, y);
    box(ctx, bx, by, TILE, TILE, groundPalettes[zone][seed % 4]);
    // Layer low-contrast flakes on the cave floor without competing with ore.
    ctx.save();
    ctx.translate(bx, by);
    face(ctx, [[1,12],[7,8],[16,8],[12,11],[6,12]], "#272e3b");
    for (let i = 0; i < 11; i++) {
      const r = seedAt(x, y, i + 1), px = 2 + r % 35, py = 3 + (r >>> 10) % 33;
      const colors = ["#29303b", "#1b2330", "#2e3340", "#252d38"];
      box(ctx, px, py, 1 + ((r >>> 20) % 3), 1, colors[i % 4]);
      if (i === 2 || i === 7) {
        box(ctx, px - 1, py + 1, 3, 1, "#1a212c");
        box(ctx, px, py - 1, 2, 1, "#353a47");
      }
    }
    // A tiny survey mark helps the player read the grid without a heavy border.
    box(ctx, 0, 0, 3, 1, "#343b48");
    box(ctx, 0, 1, 1, 2, "#343b48");
    ctx.restore();
  }

  function rock(ctx, bx, by, width, height, variation, zone) {
    ctx.save();
    ctx.translate(bx, by);
    const w = width, h = height;
    face(ctx, [[2,7],[6,2],[w-8,0],[w-2,4],[w,9],[w-1,h-3],[w-6,h],[5,h],[0,h-5]], "#151c2b");
    face(ctx, [[1,8],[6,3],[w-9,1],[w-3,5],[w-1,9],[w-5,h-4],[6,h-2],[1,h-6]], "#303347");
    face(ctx, [[2,7],[7,3],[w-9,1],[w-3,5],[w-4,h-9],[w-9,h-6],[6,h-5],[2,h-8]], rockPalettes[zone][variation % 4]);
    face(ctx, [[3,7],[7,3],[w-9,1],[w-5,3],[w-11,3],[9,5],[6,7]], "#66647a");
    face(ctx, [[w-4,6],[w-1,9],[w-4,h-4],[w-9,h-1],[w-9,h-6],[w-5,h-9]], "#36394f");
    box(ctx, 5, h-6, Math.max(2, w-15), 1, "#535368");
    if (w > 18) {
      face(ctx, [[8,7],[15,5],[19,6],[14,7],[11,9]], "#515468");
      box(ctx, 9, h-3, 4, 1, "#252c3e");
    }
    ctx.restore();
  }

  function wall(ctx, x, y, zone) {
    const bx = x*TILE, by = y*TILE, s = seedAt(x, y);
    ctx.save(); ctx.translate(bx, by);
    face(ctx, [[0,10],[6,3],[21,0],[33,2],[39,9],[40,33],[35,39],[2,39],[0,34]], "#161d2b");
    if ((s & 1) === 0) {
      rock(ctx, 0, 2, 26, 22, s, zone);
      rock(ctx, 24, 5, 16, 18, s + 2, zone);
      rock(ctx, 2, 21, 17, 16, s + 1, zone);
      rock(ctx, 17, 18, 22, 20, s, zone);
    } else {
      rock(ctx, 2, 5, 17, 19, s, zone);
      rock(ctx, 15, 1, 24, 22, s + 1, zone);
      rock(ctx, 0, 20, 26, 18, s + 3, zone);
      rock(ctx, 24, 21, 15, 15, s + 2, zone);
    }
    // These tiny inclusions sit on the face of blocked rocks, keeping the
    // biome character distinct from collectible ore in a walkable corridor.
    if(seedAt(x,y,29)%4===0) {
      if(zone===0) {
        box(ctx,6,8,5,2,"#565f59");box(ctx,10,7,6,2,"#697462");
        box(ctx,13,9,2,2,"#54645b");box(ctx,9,10,1,2,"#647365");
      } else if(zone===1) {
        face(ctx,[[4,15],[10,11],[15,11],[19,8],[17,11],[12,13],[9,13]],"#896854");
        box(ctx,14,11,2,1,"#a77c59");box(ctx,6,16,4,1,"#705949");
      } else {
        box(ctx,8,12,4,1,"#6c7789");box(ctx,12,10,2,2,"#70869b");
        box(ctx,14,10,3,1,"#66778f");box(ctx,16,9,2,1,"#78799d");
      }
    }
    ctx.restore();
  }

  function copperChunk(ctx,x,y,size,alt) {
    ctx.save(); ctx.translate(x,y); ctx.scale(size,size);
    const top = alt ? "#ffd78c" : "#f6bd74";
    const mid = alt ? "#cf9055" : "#d18452";
    face(ctx, [[0,4],[3,1],[7,0],[11,3],[10,8],[7,10],[2,9],[0,7]], "#493143");
    face(ctx, [[1,4],[4,1],[7,1],[10,3],[8,5],[4,6]], top);
    face(ctx, [[1,4],[4,6],[8,5],[7,9],[2,8]], mid);
    face(ctx, [[8,5],[10,3],[10,7],[7,10],[7,8]], "#9b5d45");
    box(ctx, 3, 3, 3, 1, "#ffe5a9");
    ctx.restore();
  }

  function crystalBlade(ctx,x,y,w,h,lean,light) {
    ctx.save(); ctx.translate(x,y);
    face(ctx, [[0,-2],[lean-1,-h+4],[lean+2,-h],[lean+w-1,-h+4],[w+1,-4],[w-2,1],[2,1]], "#1c455c");
    face(ctx, [[1,-3],[lean,-h+4],[lean+2,-h+1],[lean+w-2,-h+4],[w,-5],[w-2,-1],[2,-1]], light ? "#7ad5d4" : "#49a6bc");
    face(ctx, [[lean+2,-h+1],[lean+w-2,-h+4],[w,-5],[w-2,-1],[w-3,-4]], light ? "#529eb8" : "#34748e");
    face(ctx, [[1,-4],[lean,-h+4],[lean+2,-h+1],[lean+2,-h+5],[3,-4]], light ? "#d2f7e7" : "#a8ece1");

    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)floor(ctx,x,y,zone);
    for(const p of rubble || [])if(tiles[p.y]?.[p.x]==="floor")rubbleTile(ctx,p);
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
      const tile=tiles[y]?.[x];
      if(tile==="wall"){
        if(relic && relic.x===x && relic.y===y)relicWall(ctx,relic,collectedRelic);
        else wall(ctx,x,y,zone);
      }
      if(tile==="copper"||tile==="crystal")ore(ctx,x,y,tile,removed.has(x+","+y),oreLevel(amounts?.[y]?.[x]));
    }
    if(oddity?.kind==="rebar" && tiles[oddity.y]?.[oddity.x]==="copper" && !removed.has(oddity.x+","+oddity.y)) {
      embeddedRebar(ctx,oddity);
    }
    const jadeTile=jade && tiles[jade.y]?.[jade.x];
    if(jade?.kind==="jade" && (jadeTile==="copper" || jadeTile==="crystal") && !removed.has(jade.x+","+jade.y)){
      embeddedJade(ctx,jade);
    }
    station(ctx,start,express); cached=canvas; cachedKey=key; return cached;
  }

  function drawBoard(ctx, view, timeMs = 0) {
    const start=view.start||{x:0,y:3},path=view.path?.length?view.path:[start];
    const spent=view.collected||[],tiles=view.tiles||[],now=Number(timeMs)||0;
    const zone=view.zone===1 || view.zone===2 ? view.zone : 0;
    const base=prepareBackdrop(tiles,start,spent,view.amounts,view.rubble,view.relic,view.relicCollected,zone,Boolean(view.express),view.oddity,view.jade);
    ctx.save();
    ctx.setTransform(ctx.canvas.width/W,0,0,ctx.canvas.height/H,0,0);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(base,0,0);
    for(const p of view.moves||[])marker(ctx,p,now);
    for(const p of view.targets||[]){
      const type=tiles[p.y]?.[p.x];
      if(type==="copper"||type==="crystal")markedOre(ctx,p,type);
    }
    if(view.inspect)inspectedOre(ctx,view.inspect,tiles);
    if(view.relic && view.relicInReach && !view.relicCollected)reachableRelic(ctx,view.relic,now);
    ctx.drawImage(prepareTracks(path),0,0);
    const car=view.cart||path[path.length-1];
    const cx=car.x*TILE+20,cy=car.y*TILE+21;
    let facing=car.dir;
    if(!facing && path.length>1){
      const previous=path[path.length-2];
      facing=car.x<previous.x?"left":"right";
    }
    cart(ctx,cx,cy,now,view.returning,facing,view.paint);
    for(const fx of view.effects||[]){
      const t=Math.max(0,Math.min(1,fx.progress)),e=1-(1-t)*(1-t);
      const x=20+(fx.from.x+(fx.to.x-fx.from.x)*e)*TILE;
      const y=20+(fx.from.y+(fx.to.y-fx.from.y)*e)*TILE-8*Math.sin(t*Math.PI);
      const tint=fx.type==="crystal"?"#a6efe5":"#ffd491";
      box(ctx,x-2,y-2,5,4,tint);box(ctx,x-1,y-3,2,1,"#fff0c4");
      if(t<0.7)sparkle(ctx,x-4,y+3,1,tint);
      if(oreLevel(fx.amount)>1 && t<0.88) quantityLabel(ctx,Math.round(x)+4,Math.round(y)-10,fx.amount,tint);
    }
    // Slow single-pixel glints, offset per vein, keep the board quietly alive.
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
      if(tiles[y]?.[x]!=="crystal"&&tiles[y]?.[x]!=="copper")continue;
      if(spent.some(p=>p.x===x&&p.y===y))continue;
      const phase=(now+(seedAt(x,y)%3600))%3900;
      if(phase<250) {
        const copper=tiles[y][x]==="copper";
        const amount=oreLevel(view.amounts?.[y]?.[x]);
        const glintX=(copper?[19,27,24]:[20,25,24])[amount-1];
        const variant=seedAt(x,y,14);
        const px=(variant & 1)===1 ? TILE-glintX : glintX;
        const py=(copper?[19,14,7]:[13,8,4])[amount-1];
        sparkle(ctx,x*TILE+px,y*TILE+py,phase>75&&phase<175?2:1,copper?"#fff1bb":"#d4f8ee");
      }
    }
    if(view.pulse)oreGains(ctx,view.pulse,tiles);
    ctx.restore();
  }
  window.MineArt={drawBoard,drawVehicle,drawIcon:icon,width:W,height:H,tileSize:TILE};
})();

<script>
/* Original 320×128 pixel scenes. All motion is sampled from caller-supplied progress. */
(() => {
  'use strict';
  const W=320, H=128;
  const clamp=n=>Math.max(0,Math.min(1,n));
  const ease=t=>t*t*(3-2*t);
  const mix=(a,b,t)=>a+(b-a)*t;
  const snap=Math.round;
  function rect(c,x,y,w,h,ink) {
    c.fillStyle=ink;c.fillRect(snap(x),snap(y),w,h);
  }
  function polygon(c,points,ink) {
    c.fillStyle=ink;
    const lo=Math.ceil(Math.min(...points.map(p=>p[1])));
    const hi=Math.ceil(Math.max(...points.map(p=>p[1])));
    for(let y=lo;y<hi;y++){
      const cuts=[],scan=y+.5;
      for(let i=0,j=points.length-1;i<points.length;j=i++){
        const a=points[j],b=points[i];
        if((a[1]>scan)!==(b[1]>scan))
          cuts.push(a[0]+(b[0]-a[0])*(scan-a[1])/(b[1]-a[1]));
      }
      cuts.sort((a,b)=>a-b);

        const x=snap(cuts[n]),w=snap(cuts[n+1])-x;
        if(w>0)c.fillRect(x,y,w,1);

  }
  function line(c,ax,ay,bx,by,ink,width=1) {
    let x=snap(ax),y=snap(ay);

    const sx=x<tx?1:-1,sy=y<ty?1:-1;let err=dx+dy;

    while(true){
      c.fillRect(x,y,width,width);
      if(x===tx && y===ty)break;

    }
  }
  function disc(c,x,y,r,color) {
    c.fillStyle=color;

  function sparkle(c,x,y,length,color) {

  function crate(c,x,y,w,h,dark=false) {

  function mineCart(c,x,y,large,cold,full=false) {

    polygon(c,[[7,-14],[13,-14],[9,-5],[5,-5]],cold?'#394b60':'#705344');

  function sky(c,t) {

  function summit(c,t) {

    polygon(c,[[171,80],[193,73],[230,73],[221,77],[202,78],[189,85],[178,86],[162,94],[150,96]],'#646475');
    polygon(c,[[246,84],[278,77],[297,75],[290,84],[275,92],[263,110],[252,111],[243,124],[231,128]],'#626171');
    polygon(c,[[270,97],[281,88],[277,99],[265,112],[263,124],[251,128]],'#434c60');

    for(const [x,y,l] of [[198,86,17],[217,79,12],[228,88,15],[273,87,9],[255,101,9],[167,97,12],[109,116,13],[191,117,17],[66,120,10]]){

    polygon(c,[[287,37],[295,36+wave],[306,38],[302,41],[306,44],[297,43+wave],[287,45]],'#b64e45');

  function burst(c,x,y,r,phase,palette) {

  function victory(c,t) {

    polygon(c,[[13,42],[18,39],[23,39],[23,34],[29,34],[29,41],[33,41],[33,32],[37,32],[37,38],[45,38],[45,29],[49,29],[49,39],[53,39],[53,34],[60,34],[63,41],[63,49],[13,49]],'#35485d');

    rect(c,35,14,3,35,'#253345');rect(c,13,31,50,3,'#2b394a');rect(c,7,50,62,3,'#45505f');
