<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181c27">
<title>回程矿车 · 像素采矿小游戏</title>
<style>
:root{color-scheme:dark;--bg:#181c27;--panel:#232936;--edge:#424858;--paper:#f3d59a;--ink:#2e271e;--amber:#ffbd59;--muted:#b2b7bd;--soft:#dee2e2;--blue:#81dbe1;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(ellipse at 33% 15%,#30384a60,transparent 60%),radial-gradient(#818a9b19 .8px,transparent .8px);background-size:auto,6px 6px;color:#f4f0e7;font:15px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,canvas[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button:disabled{cursor:default}
.wrap{max-width:980px;margin:auto;padding:clamp(15px,3vw,40px) clamp(14px,3.3vw,38px) 28px}
.mast{display:flex;align-items:center;gap:18px;justify-content:space-between;margin-bottom:23px;padding-bottom:18px;border-bottom:1px solid #595d68}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.crest{background:#eeb45e;width:56px;height:56px;display:grid;place-items:center;box-shadow:3px 3px 0 #080b14;clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px))}
h1{font-weight:900;font-size:clamp(29px,4vw,44px);line-height:1;letter-spacing:.06em;margin:0;white-space:nowrap}
.pixel-title{width:176px;height:44px;display:block;image-rendering:pixelated}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.nav{display:flex;gap:8px}.quiet{border:1px solid var(--edge);background:#242a37;border-radius:5px;min-height:36px;padding:6px 11px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;line-height:1.2}
button:not(:disabled):hover{filter:brightness(1.12)}button:not(:disabled):active{transform:translateY(1px)}
.icon{width:18px;height:18px;vertical-align:middle;image-rendering:pixelated;flex:none}.crest .icon{width:39px;height:39px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 274px;grid-template-areas:"board order" "board tools" "board .";gap:15px 22px;align-items:start}
.board-card{grid-area:board;padding:12px;background:#272d3b;border:1px solid #535869;border-radius:9px;box-shadow:0 5px 0 #0d1119,0 12px 34px #090c1430}
.topline{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:0 1px 10px;min-height:29px}
.shift{font-size:13px;display:flex;align-items:center;gap:8px;white-space:nowrap;letter-spacing:.04em}.dot{width:7px;height:7px;background:var(--amber);box-shadow:0 0 7px #ffbd5955}
.rail-count{font-size:13px;color:var(--soft);display:flex;align-items:center;gap:7px}.rail-count b,.number{font-family:var(--mono);font-variant-numeric:tabular-nums}.rail-count b{color:var(--amber);font-size:17px}
.canvas-shell{position:relative;border:3px solid #10151e;outline:1px solid #4e5563;border-radius:2px;overflow:hidden;background:#232837}
#board,#fast-board{width:100%;height:auto;display:block;aspect-ratio:8/7;image-rendering:pixelated;touch-action:none;cursor:crosshair}
.hint{font-size:13px;color:#d4d8d8;margin:11px 1px 9px;line-height:1.5;min-height:20px}.hint.warn{color:#ffc478}
.controls{display:grid;grid-template-columns:minmax(80px,1fr) minmax(132px,1.6fr);gap:9px}
.control{border-radius:4px;min-height:47px;border:1px solid #52596a;background:#363d4d;box-shadow:inset 0 1px 0 #ffffff15,0 2px #161a24;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700}
.control:disabled{opacity:.46}.primary{background:var(--amber);border-color:#ffd595;color:#2d251b;box-shadow:inset 0 2px 0 #ffe1a0,0 3px 0 #78522a}
.order{grid-area:order;background:var(--paper);color:var(--ink);padding:17px 18px 19px;position:relative;border-radius:5px 5px 0 0;box-shadow:0 3px 0 #0e142040}
.order:after{content:"";position:absolute;left:0;bottom:-4px;width:100%;height:6px;background:linear-gradient(135deg,var(--paper) 25%,transparent 25%) -4px 0,linear-gradient(225deg,var(--paper) 25%,transparent 25%) -4px 0;background-size:8px 8px}
.order-head,.section-head,.inv-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h2,h3,p{margin:0}h2{font-size:17px;font-weight:800;letter-spacing:.05em}.ticket-no{font:12px var(--mono);letter-spacing:.09em;opacity:.76}
.order-rows{border-top:1px dashed #927951;margin:10px 0 8px;padding-top:8px}.ore-row{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:14px;font-weight:650}.ore-row .number{margin-left:auto;font-size:16px}.ore-row .icon{width:22px;height:22px}.done{color:#285838}
.reward{font-size:12px;color:#5f4a2d;display:flex;gap:7px;align-items:center}.reward .icon{width:15px;height:15px}
.tools{grid-area:tools;background:#232936;border:1px solid var(--edge);border-radius:6px;padding:16px 17px}
.section-head{margin-bottom:8px}.section-head small,.small{font-size:12px;color:var(--muted)}.equip-list{display:flex;flex-direction:column;gap:5px}.equip-item{width:100%;display:flex;align-items:center;gap:8px;line-height:1.35;text-align:left;background:#292f3c;border:1px solid #464d5d;padding:7px 9px;border-radius:4px;font-size:13px}.equip-item[aria-pressed=true]{border-color:#c89953;background:#37322c;color:#ffda9d}.equip-item .state{margin-left:auto;font-size:11px;color:#bcc0c8}.equip-item[aria-pressed=true] .state{color:#f4cf8c}.desc{font-size:12px;color:var(--muted);margin:7px 0 0;min-height:18px}
.workshop{border-top:1px solid #404654;margin-top:15px;padding-top:12px}
.inventory{margin:8px 0;display:flex;flex-wrap:wrap;gap:6px}.stock{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:3px;background:#161b26;font-size:12px;color:#d3d7dc}
.forge{padding:7px 9px;min-height:34px;width:100%;border-radius:4px;background:#323947;border:1px solid #515867;font-size:12px}.forge:disabled{color:var(--muted);background:#292e39}.forge+.forge{margin-top:6px}
.footer{margin-top:15px;color:#a2a8b3;font-size:12px;min-height:1em}
dialog{max-width:min(390px,calc(100vw - 30px));width:100%;max-height:85dvh;overflow:auto;background:#282e3b;border:2px solid #797671;color:#f5efdf;padding:22px 24px;border-radius:9px;box-shadow:0 8px 0 #10141c,0 20px 90px #080b15;line-height:1.65}
dialog::backdrop{background:#10141ec9}dialog h2{font-size:22px;color:var(--paper);margin-bottom:10px}dialog p{margin:9px 0;color:#dde0e0;font-size:14px}.modal-actions{margin-top:16px;display:flex;gap:8px}.modal-actions .control{flex:1;min-height:40px;font-size:14px}.modal-icon{width:48px;height:48px;margin:0 0 5px}.modal-icon .icon{width:48px;height:48px}
.finale-scene{--frame:#af8555;--ribbon:#382e2a;--letter:#ffe1a0;margin:0 0 12px;border:1px solid var(--frame);background:var(--ribbon);overflow:hidden;border-radius:3px;box-shadow:0 3px 0 #161b25}
.finale-scene.loss{--frame:#797f91;--ribbon:#292c39;--letter:#d8dcec}
.finale-scene canvas{display:block;width:100%;height:auto;aspect-ratio:5/2;image-rendering:pixelated}
.finale-scene figcaption{display:flex;align-items:center;justify-content:center;gap:12px;padding:4px 10px 5px;border-top:1px solid var(--frame);color:var(--letter);font-size:clamp(17px,4.5vw,21px);font-weight:850;letter-spacing:.14em;line-height:1.35}
.finale-scene figcaption::before,.finale-scene figcaption::after{content:"";width:20px;height:4px;border-block:1px solid var(--frame)}
@media(max-height:690px){dialog:has(.finale-scene) .modal-actions{position:sticky;bottom:0;background:#282e3b;padding-block:6px;box-shadow:0 5px #282e3b}}
.card-reveal{padding:12px;background:#36362f;border:1px solid #c3a168;border-radius:5px;margin:11px 0;color:#ffe4ad}.card-reveal small{color:#d4c8ac;display:block}
@media(min-width:1050px) and (min-height:760px){.wrap{padding-top:44px}}
@media(max-width:760px){.layout{grid-template-columns:minmax(0,1fr) 210px;gap:12px}.tools,.order{padding:12px}.mast{margin-bottom:16px}.board-card{padding:9px}}
@media(max-width:620px){.wrap{max-width:474px;padding:13px 13px 22px}.mast{margin-bottom:11px;padding-bottom:10px;gap:6px}.brand{gap:8px}.crest{width:36px;height:36px}.crest .icon{width:27px;height:27px}.pixel-title{width:120px;height:30px}.nav{gap:4px}.quiet{padding:5px 7px;min-height:34px;font-size:12px}.quiet .icon{width:15px;height:15px}.layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"order" "board" "tools";gap:12px}.order{padding:7px 10px 8px;display:flex;align-items:center;justify-content:space-between;gap:5px}.order-head h2{font-size:14px}.ticket-no{display:none}.order-rows{padding:0;margin:0;border:0;display:flex;gap:11px}.ore-row{gap:3px;padding:0;font-size:12px}.ore-row .icon{width:17px;height:17px}.ore-row .number{font-size:13px}.reward{display:none}.tools{padding:12px}.board-card{padding:8px}.topline{margin-bottom:6px;min-height:24px}.hint{font-size:12px;margin:8px 0}.control{min-height:43px}.footer{margin-top:10px}.workshop{margin-top:10px}.equip-list{display:flex;flex-direction:row;flex-wrap:wrap}.equip-item{width:auto;flex-grow:1}.section-head{margin-bottom:6px}}

.hint-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:39px}.tip-button{background:transparent;color:#eed19b;font-size:12px;border:0;border-bottom:1px dotted #b89769;padding:2px;white-space:nowrap}.stage-switch{min-width:0;display:flex;align-items:center;gap:6px;padding:4px 8px;background:#34323a;color:#efdbc0;border:1px solid #685843;border-radius:4px;text-align:left;line-height:1.4;font-size:13px}
.stage-switch b{font-family:var(--mono);color:#ffd08a;white-space:nowrap}.stage-switch #stage-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chevron{color:#d8ad77}
#atlas:disabled{opacity:.8}
#modal:has(.stage-list){max-width:min(478px,calc(100vw - 24px))}
.grade-key{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:10px 3px;border-block:1px dashed #5b5c63;margin:8px 0 12px}
.grade-key span{display:flex;align-items:center;gap:3px;color:#e8d9ba;font-size:12px}.grade-key .icon{width:22px;height:22px}
.stage-list{list-style:none;margin:0;padding:0}
.stage-list li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 5px;border-bottom:1px solid #444854}
.stage-list li[aria-current="step"]{background:#494031;box-shadow:inset 3px 0 #ffbc60}
.stage-list .num{font:15px var(--mono);text-align:center;color:#c8ccd0}
.stage-list b{font-size:14px}.stage-list .order-target{display:block;font-size:12px;line-height:1.3;color:#bdc4c8}
.stage-list small{font-size:12px;color:var(--paper)}.stage-list .cleared{color:#99d7b0}
#modal .next-intro{font-size:13px;color:#c8d1d0}
@media(max-width:390px){.stage-switch{font-size:12px;padding:4px 5px;gap:3px}.rail-count{gap:4px}.topline{gap:4px}.grade-key{gap:2px}.grade-key span{gap:1px}.grade-key .icon{width:18px;height:18px}}

.side-order{display:flex;align-items:center;gap:5px;padding-top:7px;margin-top:9px;border-top:1px dashed #967a4d;font-size:12px;font-weight:650;color:#5e4634}.side-order[hidden]{display:none}.side-order.ready{color:#25604c}.side-order .icon{width:17px;height:17px}
.specimen-panel{margin-top:14px;padding-top:11px;border-top:1px solid #404654}.specimen-panel .quiet{min-height:26px;padding:3px 7px;font-size:12px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.spec-slot{min-width:0;display:grid;justify-items:center;gap:4px;background:#1b202b;border:1px solid #454654;border-radius:4px;padding:7px 2px 5px;font-size:11px;color:#c1c3c9}
.spec-slot .icon{width:31px;height:31px}.spec-slot.owned{background:#332f2b;border-color:#a18b61;color:#f2dcae}.spec-slot.unknown .icon,.spec-entry.unknown .icon{filter:grayscale(.8);opacity:.5}
.spec-entry{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:12px;margin:10px 0;padding:10px 12px;border:1px solid #535361;background:#272d37;border-radius:5px}.spec-entry .icon{width:42px;height:42px}.spec-entry b{color:#efdab0}.spec-entry p{margin:2px 0;font-size:12px}.spec-entry .small{font-size:11px}
.dig-display{position:relative;display:grid;min-height:124px;place-items:center;overflow:hidden;margin:12px 0;background:radial-gradient(ellipse at center,#514337 0,#322f34 48%,#1b202c 85%);border:1px solid #726047;border-radius:4px}.dig-display::before,.dig-display::after{content:"";position:absolute;pointer-events:none;inset:8px;border-block:1px dashed #aa89632e}.dig-display::after{inset:14px 8px;border:0;border-inline:1px dashed #aa89632e}.dig-display .icon{width:80px;height:80px;filter:drop-shadow(0 6px 0 #0e101c80)}
.dig-meter{position:relative;margin:20px 2px 13px;height:23px;background:repeating-linear-gradient(to right,#454957 0 1px,#1b202b 1px 10%);border:1px solid #646875;border-radius:2px}
.dig-band{position:absolute;top:0;bottom:0;border-inline:2px solid #ffe5a4;background:repeating-linear-gradient(125deg,#b68445 0 4px,#806141 4px 7px)}
.dig-needle{position:absolute;z-index:1;top:-5px;bottom:-4px;width:3px;margin-left:-1.5px;background:#e8ffff;box-shadow:0 0 4px #62c6dd}.dig-needle::before{content:"";position:absolute;left:-3.5px;top:-3px;border-top:7px solid #caffff;border-left:5px solid transparent;border-right:5px solid transparent}
.dig-meter[data-hit="true"] .dig-band{background-color:#d9b35f}
.aim-control{display:flex;gap:6px}.aim-control button{flex:1}
.stage-list .visit{min-height:28px;padding:4px 6px;font-size:11px;display:inline-flex}
@media(max-width:620px){.order:has(.side-order:not([hidden])){display:grid;grid-template-columns:1fr auto;row-gap:0}.side-order{grid-column:1/-1;padding-top:4px;margin-top:4px;font-size:11px}.side-order .icon{width:14px;height:14px}.spec-slot .icon{width:26px;height:26px}.specimen-panel{margin-top:10px}.dig-display{min-height:97px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
<!-- EXPRESS_STYLE -->
</style></head>
<body><div class="wrap"><header class="mast"><div class="brand"><span class="crest" aria-hidden="true"><canvas class="icon" data-icon="cart"></canvas></span><h1><span class="sr">回程矿车</span><canvas class="pixel-title" id="title-art" width="80" height="20" aria-hidden="true"></canvas></h1></div><nav class="nav" aria-label="游戏设置"><button class="quiet" id="audio"><canvas class="icon" data-icon="audio" aria-hidden="true"></canvas><span>音效关</span></button><button class="quiet" id="help"><b aria-hidden="true">?</b> 玩法</button></nav></header>
<nav class="mode-bar" aria-label="游玩模式"><button id="campaign-tab" aria-pressed="true" aria-controls="campaign-view"><canvas class="icon" data-icon="cart" aria-hidden="true"></canvas>矿井主线</button><button id="express-tab" aria-pressed="false" aria-controls="express-view"><canvas class="icon" data-icon="bell" aria-hidden="true"></canvas>三站快运</button></nav>
<main class="layout" id="campaign-view">
<section class="board-card" aria-label="矿井地图"><div class="topline"><button class="stage-switch" id="atlas" title="查看关卡手册" aria-label="查看关卡手册"><b id="shift"></b><span id="stage-name"></span><span class="chevron" aria-hidden="true">▾</span></button><span class="rail-count"><span id="par" title="用最少的轨道完成订单，可获得本关金轨章" style="font-size:12px;color:#c9c2a6"></span><canvas class="icon" data-icon="rail" aria-hidden="true"></canvas>余轨 <b id="rails"></b></span></div>
<div class="canvas-shell"><canvas id="board" width="256" height="224" tabindex="0" aria-label="矿井地图。方向键铺轨，退格键撤轨，空格发车。"></canvas></div>
<div class="hint-row"><p id="hint" class="hint" role="status" aria-live="polite"></p><button id="route-tip" class="tip-button" hidden>路线提示</button></div>
<div class="controls"><button id="undo" class="control">↶ 撤一格</button><button id="launch" class="control primary"><span aria-hidden="true">◀</span> 发车收矿</button></div></section>
<section class="order" aria-label="本关订单"><div class="order-head"><h2>本关订单</h2><span id="order-no" class="ticket-no"></span></div><div class="order-rows" id="order-rows"></div><p class="reward"><canvas class="icon" data-icon="card" aria-hidden="true"></canvas>首通 · 抽一张装备卡</p><p id="side-order" class="side-order" hidden></p></section>
<section class="tools" aria-label="装备与工坊">
<nav class="pit-links" aria-label="矿井设施"><button type="button" class="mobile-link" onclick="document.getElementById('rail-workshop').focus();document.getElementById('rail-workshop').scrollIntoView({block:'start'})"><canvas class="icon" data-icon="rail" aria-hidden="true"></canvas>轨道工坊</button><button class="quiet" id="campaign-yard"><canvas class="icon" data-icon="cart" aria-hidden="true"></canvas>收藏车库</button><button id="campaign-scout" class="quiet"><canvas class="icon" data-icon="lamp" aria-hidden="true"></canvas>勘探图</button></nav><div class="section-head"><h2>随车装备</h2><small id="card-count"></small></div><div id="equip" class="equip-list"></div><p class="desc" id="equip-desc"></p><div class="workshop" id="rail-workshop" tabindex="-1"><div class="section-head"><h2>轨道工坊</h2></div><div id="stock" class="inventory"></div><button id="craft" class="forge"></button><button id="redeem" class="forge" hidden></button></div><div class="specimen-panel"><div class="section-head"><h2>矿井藏品</h2><button id="museum" class="quiet" aria-label="打开矿井藏品册">图鉴</button></div><div id="shelf" class="shelf"></div></div></section>
</main><p class="footer" id="save-status"></p>
<!-- EXPRESS_VIEW -->
</div><dialog id="modal" aria-labelledby="modal-title"><div id="modal-inner"></div></dialog>
<dialog id="fast-dialog" aria-labelledby="fast-dialog-title"><div id="fast-dialog-inner"></div></dialog>
<!-- GAME -->
</body></html>
